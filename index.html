<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-base:#060b14;--bg-surface:#0d1623;--bg-card:#111d2e;--bg-card-hover:#162338;--bg-elevated:#1a2840;
  --border:#1e3050;--border-light:#243a5e;
  --blue:#2979ff;--blue-dark:#1a5fff;--blue-glow:rgba(41,121,255,0.18);--blue-dim:#163a80;
  --green:#00c853;--green-dark:#00a040;--green-dim:#003d1a;--green-glow:rgba(0,200,83,0.15);
  --red:#ff3d57;--red-dark:#cc2040;--red-dim:#4a0a12;
  --orange:#ff9800;--orange-dim:#4a2800;
  --yellow:#ffd600;--yellow-dim:#3d3000;
  --purple:#7c3aed;--purple-dim:#2d1660;
  --text-primary:#e8f0fe;--text-secondary:#8ba3c7;--text-muted:#4a6080;
  --shadow-card:0 4px 24px rgba(0,0,0,0.5);
  --radius:14px;--radius-sm:8px;--radius-lg:18px;--transition:0.18s ease;
}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg-base);color:var(--text-primary);line-height:1.6;min-height:100vh;font-size:15px;}
html,body{max-width:100%;overflow-x:hidden;}
#app{min-height:100vh;overflow-x:hidden;}
.hidden{display:none!important}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg-surface)}
::-webkit-scrollbar-thumb{background:var(--border-light);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--blue)}


/* RC5.18.3 — Timed Session Display Fix */
.boot-status{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;
  background:radial-gradient(ellipse 60% 50% at 30% 40%,rgba(41,121,255,0.08) 0%,transparent 60%),
  radial-gradient(ellipse 50% 60% at 80% 70%,rgba(124,58,237,0.06) 0%,transparent 60%),var(--bg-base);}
.boot-card{width:min(360px,92vw);background:var(--bg-card);border:1px solid var(--border-light);border-radius:22px;padding:26px 22px;text-align:center;box-shadow:var(--shadow-card)}
.boot-spinner{width:34px;height:34px;border-radius:50%;border:3px solid rgba(139,163,199,.25);border-top-color:var(--blue);margin:0 auto 14px;animation:bootSpin .85s linear infinite}
.boot-title{font-size:17px;font-weight:800;color:var(--text-primary);margin-bottom:4px}
.boot-sub{font-size:13px;color:var(--text-secondary)}
@keyframes bootSpin{to{transform:rotate(360deg)}}

/* LOGIN */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(ellipse 60% 50% at 30% 40%,rgba(41,121,255,0.08) 0%,transparent 60%),
  radial-gradient(ellipse 50% 60% at 80% 70%,rgba(124,58,237,0.06) 0%,transparent 60%),var(--bg-base);
  position:relative;overflow:hidden;}
.login::before{content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 60px,rgba(30,48,80,0.2) 60px,rgba(30,48,80,0.2) 61px),
  repeating-linear-gradient(90deg,transparent,transparent 60px,rgba(30,48,80,0.2) 60px,rgba(30,48,80,0.2) 61px);pointer-events:none;}
.login-box{background:var(--bg-card);border:1px solid var(--border-light);border-radius:22px;padding:40px 36px;width:min(440px,100%);
  box-shadow:0 24px 64px rgba(0,0,0,0.7),0 0 0 1px rgba(41,121,255,0.08);position:relative;z-index:1;}
.login-logo{text-align:center;margin-bottom:28px;}
.login-icon{font-size:52px;display:block;margin-bottom:10px;filter:drop-shadow(0 0 20px rgba(41,121,255,0.5));}
.login-title{font-size:22px;font-weight:800;color:var(--text-primary);letter-spacing:0.5px;}
.login-sub{font-size:13px;color:var(--text-muted);margin-top:4px;}
.login-divider{height:1px;background:linear-gradient(90deg,transparent,var(--border-light),transparent);margin:20px 0;}
.box{background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--radius-lg);padding:24px;box-shadow:var(--shadow-card);width:min(430px,100%);}

/* FORMS */
label{display:block;font-size:13px;font-weight:600;color:var(--text-secondary);margin-bottom:5px;letter-spacing:0.3px;}
input,select,textarea{font-family:inherit;font-size:14px;border-radius:var(--radius-sm);border:1.5px solid var(--border);padding:10px 14px;background:var(--bg-base);color:var(--text-primary);width:100%;transition:border-color var(--transition),box-shadow var(--transition);outline:none;}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-glow);}
input::placeholder,textarea::placeholder{color:var(--text-muted)}
select option{background:var(--bg-card);color:var(--text-primary)}

/* BUTTONS */
button{font-family:inherit;font-size:14px;font-weight:700;border-radius:var(--radius-sm);border:1.5px solid transparent;padding:10px 18px;cursor:pointer;transition:all var(--transition);letter-spacing:0.3px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;background:var(--blue);color:#fff;border-color:var(--blue);}
button:hover{background:var(--blue-dark);border-color:var(--blue-dark);transform:translateY(-1px);box-shadow:0 4px 14px rgba(41,121,255,0.35);}
button:active{transform:translateY(0);box-shadow:none}
.ok{background:var(--green);border-color:var(--green);color:#fff}
.ok:hover{background:var(--green-dark);border-color:var(--green-dark);box-shadow:0 4px 14px rgba(0,200,83,0.35)}
.danger{background:var(--red);border-color:var(--red);color:#fff}
.danger:hover{background:var(--red-dark);border-color:var(--red-dark);box-shadow:0 4px 14px rgba(255,61,87,0.35)}
.gray{background:var(--bg-elevated);border-color:var(--border-light);color:var(--text-secondary)}
.gray:hover{background:var(--border-light);border-color:var(--border);color:var(--text-primary);box-shadow:none}
.btn-lg{padding:13px 24px;font-size:16px;border-radius:var(--radius);width:100%}
.btn-warn{background:var(--yellow-dim);border-color:rgba(255,214,0,0.3);color:var(--yellow)}
.btn-warn:hover{background:var(--yellow);color:#000;box-shadow:0 4px 14px rgba(255,214,0,0.3)}

/* TOP BAR */
.top{position:sticky;top:0;background:rgba(6,11,20,0.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;justify-content:space-between;align-items:center;z-index:50;gap:12px;}
.top-brand{display:flex;align-items:center;gap:10px}
.top-brand-icon{font-size:26px;filter:drop-shadow(0 0 10px rgba(41,121,255,0.5))}
.top-brand-name{font-size:18px;font-weight:800;color:var(--text-primary);letter-spacing:0.3px}
.top-meta{font-size:12px;color:var(--text-muted);margin-top:2px}
.top-meta span{color:var(--text-secondary)}
.top-actions{display:flex;gap:8px;align-items:center}

/* TABS */
.tabs{display:flex;gap:4px;overflow-x:auto;padding:10px 16px;background:var(--bg-surface);border-bottom:1px solid var(--border);scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;background:transparent;border:1.5px solid transparent;color:var(--text-muted);font-size:13px;font-weight:600;padding:8px 16px;border-radius:var(--radius-sm);cursor:pointer;transition:all var(--transition);letter-spacing:0.3px;}
.tab:hover{background:var(--bg-elevated);color:var(--text-primary);transform:none;box-shadow:none;}
.tab.active{background:var(--blue-dim);border-color:var(--blue);color:#fff;box-shadow:0 0 12px var(--blue-glow);}
.tab.active:hover{background:var(--blue-dim);box-shadow:0 0 12px var(--blue-glow)}

/* CONTENT */
.content{padding:20px;max-width:1340px;margin:0 auto;}

/* CARD */
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow-card);transition:border-color var(--transition);}

/* DEVICE CARDS */
.device-card{background:var(--bg-card);border:1.5px solid var(--border);border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow-card);transition:all 0.25s ease;position:relative;overflow:hidden;}
.device-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--border);transition:background 0.25s ease;}
.device-card.available{border-color:rgba(0,200,83,0.25)}
.device-card.available::before{background:linear-gradient(90deg,var(--green),var(--green-dark))}
.device-card.busy{border-color:rgba(255,152,0,0.3);background:linear-gradient(160deg,var(--bg-card) 60%,rgba(255,152,0,0.04))}
.device-card.busy::before{background:linear-gradient(90deg,var(--orange),#ff6d00)}
.device-card.maintenance{border-color:rgba(255,61,87,0.2)}
.device-card.maintenance::before{background:var(--red)}

/* ALERT STATES */
.device-card.warn-10{border-color:rgba(255,214,0,0.5)!important;background:linear-gradient(160deg,var(--bg-card) 60%,rgba(255,214,0,0.04))!important}
.device-card.warn-10::before{background:linear-gradient(90deg,var(--yellow),#ffab00)!important}
.device-card.warn-5{border-color:rgba(255,61,87,0.6)!important;background:linear-gradient(160deg,var(--bg-card) 60%,rgba(255,61,87,0.07))!important}
.device-card.warn-5::before{background:linear-gradient(90deg,var(--red),#ff6b7a)!important}
.device-card.overtime{border-color:rgba(255,61,87,0.8)!important}
.device-card.overtime::before{background:linear-gradient(90deg,var(--red),var(--red-dark))!important}

/* Session timer colors */
.session-timer{font-size:30px;font-weight:900;color:var(--orange);text-shadow:0 0 20px rgba(255,152,0,0.3);margin:6px 0;font-variant-numeric:tabular-nums;}
.session-timer.warn-10-txt{color:var(--yellow);text-shadow:0 0 20px rgba(255,214,0,0.4);}
.session-timer.warn-5-txt{color:var(--red);text-shadow:0 0 20px rgba(255,61,87,0.5);}
.session-timer.overtime-txt{color:var(--red);animation:blinkRed 0.8s ease-in-out infinite;text-shadow:0 0 24px rgba(255,61,87,0.7);}
@keyframes blinkRed{0%,100%{opacity:1}50%{opacity:0.4}}

/* Match badge */
.match-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700;background:rgba(124,58,237,0.15);border:1px solid rgba(124,58,237,0.3);color:#a78bfa;margin-top:4px;}

/* Progress bar for match sessions */
.match-progress-wrap{background:var(--bg-base);border-radius:999px;height:6px;margin:8px 0 4px;overflow:hidden;border:1px solid var(--border);}
.match-progress-bar{height:100%;border-radius:999px;transition:width 1s linear,background 0.5s;}
.match-progress-bar.ok-bar{background:linear-gradient(90deg,var(--green),#69f0ae);}
.match-progress-bar.warn10-bar{background:linear-gradient(90deg,var(--yellow),#ffcc02);}
.match-progress-bar.warn5-bar{background:linear-gradient(90deg,var(--red),#ff6b7a);}
.match-progress-bar.over-bar{background:var(--red);animation:blinkRed 0.8s ease-in-out infinite;}

.device-card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:8px}
.device-name{font-size:17px;font-weight:800;color:var(--text-primary)}
.device-rate{font-size:11px;color:var(--text-muted);margin-top:2px}
.device-divider{height:1px;background:var(--border);margin:12px 0}
.session-info{font-size:13px;color:var(--text-secondary);line-height:1.8}
.session-info strong{color:var(--text-primary)}
.session-cost{font-size:12px;color:var(--text-muted);margin-bottom:8px}

.live-session-panel{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0 6px;}
.live-session-box{background:rgba(6,17,31,.55);border:1px solid rgba(75,111,160,.34);border-radius:12px;padding:8px 10px;min-width:0;}
.live-session-box span{display:block;font-size:11px;color:var(--text-muted);line-height:1.25;margin-bottom:3px;}
.live-session-box strong{display:block;font-size:16px;line-height:1.2;color:var(--text-primary);font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.live-session-box.open-timer strong{color:var(--green);font-variant-numeric:tabular-nums;}
.live-session-box.match-fixed strong{color:#c4b5fd;}
.live-session-box.current-total strong{color:var(--yellow);font-variant-numeric:tabular-nums;}
.live-session-box.drink-total strong{color:#93c5fd;font-variant-numeric:tabular-nums;}
@media(max-width:700px){.live-session-panel{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:8px 0 4px}.live-session-box{padding:7px 8px;border-radius:11px}.live-session-box span{font-size:10.5px}.live-session-box strong{font-size:14px}}
.session-total{font-size:22px;font-weight:900;color:var(--green);text-shadow:0 0 16px rgba(0,200,83,0.25);margin:4px 0 10px;}
.device-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.device-actions button{flex:1;min-width:80px;padding:9px 12px;font-size:13px}
.device-start-btn{width:100%;margin-top:10px;padding:11px;background:linear-gradient(135deg,var(--green-dim),rgba(0,200,83,0.12));border-color:rgba(0,200,83,0.3);color:var(--green);font-size:14px;}
.device-start-btn:hover{background:var(--green);color:#fff;box-shadow:0 4px 18px rgba(0,200,83,0.35)}

/* Alert notification toast */
#alert-toast{position:fixed;top:92px;left:18px;right:auto;bottom:auto;transform:none;z-index:9999;display:flex;flex-direction:column;gap:7px;pointer-events:none;width:min(360px,calc(100vw - 28px));max-height:42vh;overflow:hidden;}
.toast-item{background:rgba(16,31,52,0.96);border:1.2px solid var(--border-light);border-radius:14px;padding:9px 12px;box-shadow:0 8px 24px rgba(0,0,0,0.45);display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;line-height:1.45;animation:toastIn 0.22s ease;pointer-events:auto;backdrop-filter:blur(10px);}
.toast-item span:last-child{display:block;overflow:hidden;text-overflow:ellipsis;}
@media(max-width:700px){#alert-toast{top:76px;left:10px;width:min(330px,calc(100vw - 20px));}.toast-item{font-size:11.5px;padding:8px 10px;border-radius:12px;}}
.toast-item.t-warn{border-color:rgba(255,214,0,0.4);background:rgba(60,40,0,0.95);}
.toast-item.t-danger{border-color:rgba(255,61,87,0.5);background:rgba(60,10,18,0.95);}
.toast-item.t-end{border-color:rgba(255,152,0,0.5);background:rgba(50,25,0,0.95);}
.toast-icon{font-size:20px;flex-shrink:0}
@keyframes toastIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}

/* Session type select buttons */
.type-toggle{display:flex;gap:0;border-radius:var(--radius-sm);overflow:hidden;border:1.5px solid var(--border);}
.type-toggle button{border-radius:0;border:none;background:var(--bg-base);color:var(--text-muted);flex:1;padding:9px;font-size:13px;}
.type-toggle button.sel{background:var(--blue-dim);color:#fff;border-bottom:2px solid var(--blue);}
.type-toggle button:hover:not(.sel){background:var(--bg-elevated);transform:none;box-shadow:none;}

/* KPI */
.kpi{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;position:relative;overflow:hidden;transition:border-color var(--transition),transform var(--transition);}
.kpi::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--blue),var(--purple));}
.kpi:hover{border-color:var(--border-light);transform:translateY(-2px)}
.kpi-label{font-size:12px;color:var(--text-muted);font-weight:600;letter-spacing:0.5px;text-transform:uppercase}
.kpi b{font-size:26px;font-weight:900;display:block;margin-top:6px;color:var(--text-primary);font-variant-numeric:tabular-nums;}
.kpi-green::after{background:linear-gradient(90deg,var(--green),#00e676)}.kpi-green b{color:var(--green)}
.kpi-red::after{background:linear-gradient(90deg,var(--red),#ff6b7a)}.kpi-red b{color:var(--red)}
.kpi-orange::after{background:linear-gradient(90deg,var(--orange),#ffcc02)}.kpi-orange b{color:var(--orange)}

/* LAYOUT */
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.col{display:flex;flex-direction:column;gap:8px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
.mb{margin-bottom:16px}.mt{margin-top:16px}

/* TYPOGRAPHY */
.big{font-size:20px;font-weight:800;color:var(--text-primary);letter-spacing:0.2px}
.section-title{font-size:18px;font-weight:800;color:var(--text-primary)}
.muted{color:var(--text-muted)}.small{font-size:12px}.price{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums}

/* BADGES */
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;}
.b-ok{background:var(--green-dim);color:var(--green);border:1px solid rgba(0,200,83,0.2)}
.b-busy{background:var(--orange-dim);color:var(--orange);border:1px solid rgba(255,152,0,0.2)}
.b-bad{background:var(--red-dim);color:var(--red);border:1px solid rgba(255,61,87,0.15)}

/* SYNC */
.sync{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;background:var(--bg-elevated);border:1px solid var(--border);padding:4px 10px;border-radius:999px;letter-spacing:0.3px;}
.sync::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--text-muted);display:inline-block}
.sync.on{background:var(--green-dim);border-color:rgba(0,200,83,0.2);color:var(--green)}.sync.on::before{background:var(--green);box-shadow:0 0 6px var(--green)}
.sync.warn{background:var(--orange-dim);border-color:rgba(255,152,0,0.2);color:var(--orange)}.sync.warn::before{background:var(--orange)}
.sync.err{background:var(--red-dim);border-color:rgba(255,61,87,0.15);color:var(--red)}.sync.err::before{background:var(--red)}

/* TABLES */
.tw{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-surface);}
table{width:100%;border-collapse:collapse;min-width:600px;}
th{background:var(--bg-base);padding:12px 16px;text-align:right;font-size:12px;font-weight:700;color:var(--text-muted);letter-spacing:0.6px;text-transform:uppercase;border-bottom:1px solid var(--border);white-space:nowrap;}
td{border-bottom:1px solid rgba(30,48,80,0.5);padding:12px 16px;text-align:right;font-size:14px;color:var(--text-secondary);transition:background var(--transition);}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(41,121,255,0.04);color:var(--text-primary)}
td button{padding:6px 12px;font-size:12px}

/* MODAL */
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:999;animation:fadeIn 0.15s ease;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal .box{max-height:calc(100dvh - 32px);min-height:0;overflow-y:auto;width:min(720px,100%);background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--radius-lg);padding:28px;box-shadow:0 32px 80px rgba(0,0,0,0.8),0 0 0 1px rgba(41,121,255,0.08);animation:slideUp 0.2s ease;}
@keyframes slideUp{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal .big{margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.modal .grid{margin-bottom:16px}

/* PAGE HEADERS */
.page-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:20px;}
.page-subtitle{font-size:13px;color:var(--text-muted);margin-top:3px}

/* DASH */
.dash-header{background:linear-gradient(135deg,var(--bg-card) 0%,rgba(41,121,255,0.05) 100%);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px 24px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}

/* SETTINGS */
.settings-section{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px;}
.settings-note{background:rgba(41,121,255,0.06);border:1px solid rgba(41,121,255,0.15);border-radius:var(--radius-sm);padding:12px 14px;font-size:13px;color:var(--text-secondary);margin-bottom:14px;line-height:1.7;}

/* INVOICE */
.invoice-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:6px 0;border-bottom:1px dashed rgba(75,111,160,.32);font-size:13px;color:var(--text-secondary);line-height:1.45;}
.invoice-row span:first-child{color:var(--text-muted);font-weight:700;white-space:nowrap;}
.invoice-row span:last-child,.invoice-row strong{color:var(--text-primary);text-align:left;overflow-wrap:anywhere;}
.invoice-row:last-of-type{border-bottom:none}
.invoice-total-row{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;margin:10px 0 2px;border:1px solid rgba(0,200,83,.28);border-radius:14px;background:linear-gradient(135deg,rgba(0,200,83,.10),rgba(6,17,31,.55));font-size:22px;font-weight:900;color:var(--green);}
.invoice-total-row span:first-child{font-size:20px;color:var(--green)}
.invoice-total-row.voided-total{color:var(--text-muted);text-decoration:line-through;text-decoration-thickness:2px;}
.invoice-void-note{margin-top:10px;padding:9px 11px;border-radius:var(--radius-sm);border:1px solid rgba(255,61,87,.28);background:rgba(255,61,87,.06);color:#ff9aaa;font-size:12px;font-weight:700;}
.invoice-modal-title{position:sticky;top:-28px;z-index:3;background:var(--bg-card);padding:2px 0 12px;margin-bottom:4px;border-bottom:1px solid var(--border-light);}
.invoice-actions{position:sticky;bottom:-28px;z-index:3;background:linear-gradient(180deg,rgba(17,29,46,0) 0%,var(--bg-card) 24%);padding:14px 0 2px;margin-top:6px;display:grid;grid-template-columns:1fr 1fr;gap:8px;}

.invoice-actions .wide{grid-column:1/-1}
@media(max-width:480px){.invoice-row{font-size:12.5px;padding:5px 0}.invoice-total-row{font-size:21px;padding:10px 12px}.invoice-total-row span:first-child{font-size:18px}.invoice-actions{gap:7px}.invoice-actions button{min-height:42px;font-size:12.5px}}
.action-wrap{position:relative;display:inline-flex;justify-content:center;align-items:center;}
.action-menu{position:absolute;top:calc(100% + 6px);left:0;min-width:170px;background:var(--bg-elevated);border:1px solid var(--border-light);border-radius:12px;box-shadow:0 18px 44px rgba(0,0,0,.55);padding:6px;z-index:80;display:none;}

.compact-list{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
.compact-line{display:grid;grid-template-columns:1.4fr .7fr .7fr auto;gap:8px;align-items:center;background:var(--bg-base);border:1px solid var(--border);border-radius:10px;padding:8px;}
.compact-line span{font-size:13px;color:var(--text-secondary);}
.match-choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}
.match-choice{background:var(--bg-base);border:1.5px solid var(--border);border-radius:12px;padding:12px;text-align:center;cursor:pointer;transition:all var(--transition);}
.match-choice:hover,.match-choice.sel{border-color:var(--blue);background:var(--blue-dim);color:#fff;}
.match-choice strong{display:block;font-size:18px;color:var(--text-primary);}
.match-choice small{display:block;color:var(--text-muted);margin-top:3px;}

<script>
// ============================================================
// CORE STATE & STORAGE
// ============================================================
const APP_VERSION='V6.4.2-RC5.18.8';
const K='ps_cafe_v4_state', SK='ps_cafe_v4_settings', QK='ps_cafe_v4_sync_queue', SMK='ps_cafe_v4_sync_meta';
const CLOUD_AUDIT_TABLE='ps_audit_logs';
let state,user=null,tab='Dashboard',dirty=false,timer=null,swRegistration=null,installPromptEvent=null,cloudMembers=[];

function syncMeta(){try{return JSON.parse(localStorage.getItem(SMK))||{verified:false,lastSuccess:'',lastError:'',syncing:false}}catch(e){return{verified:false,lastSuccess:'',lastError:'',syncing:false}}}
function setSyncMeta(patch){let m={...syncMeta(),...patch};localStorage.setItem(SMK,JSON.stringify(m));if(user)render();return m}
function shortTime(iso){return iso?new Date(iso).toLocaleString('ar-EG',{dateStyle:'short',timeStyle:'short'}):'—'}

function id(){return 'id_'+Math.random().toString(36).slice(2)+Date.now().toString(36)}

// DEFAULT match pricing configs per device: {mins, single, multi}
const DEF_MATCH_PRICES=[
  {mins:5,single:5,multi:10},
  {mins:10,single:10,multi:20},
  {mins:15,single:15,multi:25},
  {mins:30,single:25,multi:40}
];

function def(){
  return{
    users:[
      {id:id(),username:'admin',password:'1234',role:'Owner',active:true},
      {id:id(),username:'cashier',password:'1234',role:'Cashier',active:true}
    ],
    devices:[1,2,3,4,5].map(n=>({
      id:'ps'+n,name:'PS '+n,status:'available',singleRate:60,multiRate:90,
      matchPrices:DEF_MATCH_PRICES.map(x=>({...x}))
    })),
    products:['شاي:15','قهوة:25','نسكافيه:30','مياه:10','عصير:20','كانز:25'].map(x=>{
      let a=x.split(':');return{id:id(),name:a[0],price:+a[1],stock:0,active:true}
    }),
    profile:{businessName:'PS Cafe',ownerName:'',phone:'',address:''},sessions:[],invoices:[],expenses:[],shiftClosures:[],auditLogs:[],nextInvoice:1,updatedAt:new Date().toISOString()
  }
}

function load(){try{state=JSON.parse(localStorage.getItem(K))||def()}catch(e){state=def()}
  if(!state.profile)state.profile={businessName:'PS Cafe',ownerName:'',phone:'',address:''};
  if(!Array.isArray(state.auditLogs))state.auditLogs=[];
  if(!Array.isArray(state.shiftClosures))state.shiftClosures=[];
  state.users=(state.users||[]).map(u=>({...u,role:u.role==='Admin'?'Owner':u.role}));
  state.devices.forEach(d=>{if(!d.matchPrices)d.matchPrices=DEF_MATCH_PRICES.map(x=>({...x}))});
  normalizeAllInvoices();
  save(false)
}
function save(md=true){state.updatedAt=new Date().toISOString();localStorage.setItem(K,JSON.stringify(state));if(md&&st().mode!=='secure_cloud'){dirty=true;markPending('تغيير محلي');sched()}render()}
function baseSettings(){return {mode:'offline',url:'',key:'',businessId:'',cloudEmail:'',session:null,schema:'normalized_v2_controlled_corrections'}}
function st(){try{return {...baseSettings(),...(JSON.parse(localStorage.getItem(SK))||{})}}catch(e){return baseSettings()}}
function setst(s){localStorage.setItem(SK,JSON.stringify({...baseSettings(),...s}));setup();render()}
function money(n){return (Number(n)||0).toFixed(2)}
function ceilToFive(n){n=Number(n)||0;return n<=0?0:Math.ceil(n/5)*5}
function billOpenPlay(raw){raw=Number(raw)||0;return raw<=0?0:Math.max(5,ceilToFive(raw))}
function fmt(d){return d?new Date(d).toLocaleString('ar-EG'):''}
function localBusinessDate(value=new Date()){return new Intl.DateTimeFormat('en-CA',{timeZone:'Africa/Cairo'}).format(value instanceof Date?value:new Date(value))}
function today(){return localBusinessDate()}
function val(x){return document.getElementById(x)?.value||''}
function matchOptionPrice(opt,mode){return Number((mode==='multi'?opt.multi:opt.single) ?? opt.price ?? 0)||0}
function matchOptionLabel(opt,mode){return `${Number(opt.mins)||0} دقيقة — ${money(matchOptionPrice(opt,mode))} ج`}
const TIMED_MARKER_PREFIX='__PS_TIMED_SESSION__:';
function isTimedMarker(x){return !!x && String(x.name||'').startsWith(TIMED_MARKER_PREFIX);}
function timedMarkerName(mins){return TIMED_MARKER_PREFIX+(Number(mins)||0);}
function timedMinsFromMarker(x){const m=String(x?.name||'').match(/^__PS_TIMED_SESSION__:(\d+)/);return m?Number(m[1])||0:0;}
function timedMinsFromItems(items){return (items||[]).reduce((max,i)=>Math.max(max,timedMinsFromMarker(i)),0);}
function cleanVisibleItems(items){return (items||[]).filter(i=>!isTimedMarker(i));}
function isMatchLine(x){return !!x && !isTimedMarker(x) && (x.type==='match'||x.itemType==='match'||x.item_type==='match'||String(x.name||'').trim().startsWith('مباراة'));}
function matchItemsTotal(items){return (items||[]).filter(isMatchLine).reduce((a,i)=>a+(+i.price||0)*(+i.qty||1),0);}
function nonMatchItemsTotal(items){return (items||[]).filter(i=>!isTimedMarker(i)&&!isMatchLine(i)).reduce((a,i)=>a+(+i.price||0)*(+i.qty||1),0);}
function matchItemsCount(items){return (items||[]).filter(isMatchLine).reduce((a,i)=>a+(+i.qty||1),0);}
function sessionMatchCount(s){return (s&&s.sessionType==='match'?1:0)+matchItemsCount((s&&s.items)||[]);}
function invoiceMatchCount(i){return (i&&i.sessionType==='match'?1:0)+matchItemsCount((i&&i.items)||[]);}
function matchCountLabel(n){return n===1?'مباراة واحدة':(n===2?'مباراتان':(n>=3&&n<=10?n+' مباريات':n+' مباراة'));}
const TIMED_SESSION_OPTIONS=[30,60,90,120];
const TMK='ps_cafe_v4_timed_meta';
function timedMeta(){try{return JSON.parse(localStorage.getItem(TMK))||{}}catch(e){return {}}}
function rememberTimedSession(sid,mins){if(!sid||!mins)return;const m=timedMeta();m[sid]=Number(mins)||0;localStorage.setItem(TMK,JSON.stringify(m));}
function forgetTimedSession(sid){const m=timedMeta();if(m&&sid&&m[sid]){delete m[sid];localStorage.setItem(TMK,JSON.stringify(m));}}
function timedMins(s){return Number((s&&(s.timedMins||s.timedMinutes||s.timedDuration||timedMeta()[s.id]||timedMinsFromItems(s.items)||((s.sessionType==='timed'||s.sessionType==='open')?s.matchMins:0)))||0)||0}
function isTimedSession(s){return !!(s&&(s.sessionType==='timed'||(s.sessionType==='open'&&timedMins(s)>0)))}
async function persistCloudTimedSession(sid,mins){
  const m=Number(mins)||0;if(!sid||!m)return;
  rememberTimedSession(sid,m);
  if(st().mode!=='secure_cloud')return;
  const b=st().businessId;
  await req('PATCH',`ps_sessions?business_id=eq.${encodeURIComponent(b)}&id=eq.${encodeURIComponent(sid)}&status=eq.open`,{session_type:'timed',match_minutes:m},'return=minimal');
}
async function startTimedSessionDirectCloud(sid,did,customer,mode,mins){
  const b=st().businessId, d=state.devices.find(x=>x.id===did), when=new Date().toISOString();
  if(!b||!did||!d)throw Error('بيانات الجهاز أو النشاط غير مكتملة.');
  const existing=state.sessions.find(x=>x.deviceId===did&&x.status==='open');
  if(existing)throw Error('الجهاز عليه جلسة مفتوحة بالفعل. حدّث البيانات أولًا.');
  const body={
    business_id:b,
    id:sid,
    device_id:did,
    customer:customer||'',
    play_mode:mode,
    session_type:'timed',
    match_minutes:Number(mins)||0,
    match_price:timedSessionPrice(d,mode,mins),
    started_at:when,
    started_by:st().session?.userId||null,
    started_by_label:user?.username||'User',
    status:'open'
  };
  await req('POST','ps_sessions',body,'return=representation');
  try{await req('POST','ps_audit_logs',{business_id:b,id:id(),action:'TIMED_SESSION_START',entity_type:'session',entity_id:sid,summary:'بدء وقت محدد',details:{device_id:did,play_mode:mode,minutes:mins},auth_user_id:st().session?.userId||null,actor_label:user?.username||'User',actor_role:user?.role||'user'},'return=minimal');}catch(ae){console.warn('Timed direct audit skipped',ae)}
  return {ok:true,session_id:sid};
}
async function completeTimedSessionDirectCloud(s,iid){
  const b=st().businessId, d=state.devices.find(x=>x.id===s.deviceId), c=cost(s), ended=new Date().toISOString();
  if(!b||!s||!d)throw Error('بيانات الإنهاء غير مكتملة.');
  const invoiceBody={
    business_id:b,
    id:iid,
    invoice_no:null,
    session_id:s.id,
    created_at:ended,
    created_by:st().session?.userId||null,
    creator_label:user?.username||'User',
    device_id:d.id,
    device_name:d.name||'',
    customer:s.customer||'',
    play_mode:s.mode||'single',
    session_type:'timed',
    match_minutes:timedMins(s)||s.matchMins||null,
    started_at:s.start,
    ended_at:ended,
    minutes:c.m,
    play_total:+c.play.toFixed(2),
    drink_total:+c.dr.toFixed(2),
    total:+c.total.toFixed(2),
    payment_method:'Cash'
  };
  await req('POST','ps_invoices',invoiceBody,'return=representation');
  const items=cleanVisibleItems(s.items||[]);
  if(items.length){
    await req('POST','ps_invoice_items',items.map(it=>({business_id:b,id:it.id||id(),invoice_id:iid,product_id:it.productId||it.product_id||null,name:it.name,price:+it.price||0,qty:+it.qty||1})),'return=minimal');
  }
  await req('PATCH',`ps_sessions?business_id=eq.${encodeURIComponent(b)}&id=eq.${encodeURIComponent(s.id)}&status=eq.open`,{status:'closed',ended_at:ended,ended_by:st().session?.userId||null,ended_by_label:user?.username||'User'},'return=representation');
  try{await req('POST','ps_audit_logs',{business_id:b,id:id(),action:'INVOICE_CREATE',entity_type:'invoice',entity_id:iid,summary:'إنشاء فاتورة وقت محدد',details:{session_id:s.id,session_type:'timed',minutes:c.m,total:c.total},auth_user_id:st().session?.userId||null,actor_label:user?.username||'User',actor_role:user?.role||'user'},'return=minimal');}catch(ae){console.warn('Timed direct invoice audit skipped',ae)}
  return {ok:true,invoice_id:iid,total:c.total};
}
async function ensureTimedMarker(sid,mins){
  // RC5.18.7: no hidden cloud marker is created. Timed sessions are stored as session_type='timed' in Supabase.
  // This keeps all devices consistent without local-only markers.
  return;
}
function isCloudConflictError(e){return /409|conflict|duplicate|already|تعارض|موجودة|مسجلة/i.test(String(e&&e.message?e.message:e||''));}
function sessionKind(s){return !s?'':(s.sessionType==='match'?'match':(isTimedSession(s)?'timed':'open'))}
function rateForSession(s,d){return Number((s&&s.mode)==='multi'?d?.multiRate:d?.singleRate)||0}
function timedSessionPrice(d,mode,mins){const rate=Number(mode==='multi'?d?.multiRate:d?.singleRate)||0;return billOpenPlay((Number(mins)||0)/60*rate)}
function timedClock(s){
  const total=timedMins(s)*60;
  const elapsed=Math.max(0,Math.floor((Date.now()-new Date(s.start))/1000));
  const left=total-elapsed;
  const pad=n=>String(n).padStart(2,'0');
  if(!total)return sessionClock(s);
  if(left<=0){const over=Math.abs(left),h=Math.floor(over/3600),m=Math.floor((over%3600)/60),sec=over%60;return h>0?`+${h}:${pad(m)}:${pad(sec)}`:`+${m}:${pad(sec)}`}
  const h=Math.floor(left/3600),m=Math.floor((left%3600)/60),sec=left%60;
  return h>0?`${h}:${pad(m)}:${pad(sec)}`:`${m}:${pad(sec)}`;
}
function sessionDisplayClock(s){return isTimedSession(s)?timedClock(s):sessionClock(s)}
function invoicePlayLabel(i){
  const count=invoiceMatchCount(i);
  if(i&&i.sessionType==='match')return count>1?'رسوم المباراة والمباريات الإضافية':'رسوم المباراة';
  return count>0?'رسوم اللعب والمباريات':'رسوم اللعب';
}
function normalizeInvoiceAmounts(inv){
  if(!inv)return inv;
  const out={...inv,items:Array.isArray(inv.items)?inv.items:[]};
  const matchTotal=matchItemsTotal(out.items||[]);
  let play=Number(out.playTotal)||0;
  if(out.sessionType!=='match'){
    const dev=(state?.devices||[]).find(d=>d.id===out.deviceId || d.name===out.deviceName);
    const mins=Number(out.minutes)||0;
    const tmins=timedMins(out);
    if(dev&&(mins>0||tmins>0)){
      const rate=out.mode==='multi'?Number(dev.multiRate):Number(dev.singleRate);
      const billMins=tmins?Math.max(mins,tmins):mins;
      play=billOpenPlay((billMins/60)*(rate||0))+matchTotal;
    }else{
      play=billOpenPlay(Math.max(0,play-matchTotal))+matchTotal;
    }
  }
  out.playTotal=+play.toFixed(2);
  out.drinkTotal=+(Number(out.drinkTotal)||nonMatchItemsTotal(out.items||[])).toFixed(2);
  out.total=+(out.playTotal+out.drinkTotal).toFixed(2);
  return out;
}
function normalizeAllInvoices(){if(state&&Array.isArray(state.invoices))state.invoices=state.invoices.map(normalizeInvoiceAmounts)}
function closeActionMenus(){document.querySelectorAll('.action-wrap.open').forEach(el=>el.classList.remove('open'))}
function positionActionMenu(el){
  const menu=el?.querySelector('.action-menu');if(!menu)return;
  const r=el.getBoundingClientRect();
  const w=Math.max(190,menu.offsetWidth||190), h=menu.offsetHeight||150;
  let left=Math.min(Math.max(12,r.right-w),window.innerWidth-w-12);
  let top=r.bottom+6;
  if(top+h>window.innerHeight-12) top=Math.max(12,r.top-h-6);
  menu.style.left=left+'px';menu.style.top=top+'px';
}
function toggleActionMenu(id,ev){
  if(ev)ev.stopPropagation();
  document.querySelectorAll('.action-wrap').forEach(el=>{if(el.id!==id)el.classList.remove('open')});
  const el=document.getElementById(id);if(!el)return;
  el.classList.toggle('open');
  if(el.classList.contains('open'))requestAnimationFrame(()=>positionActionMenu(el));
}
document.addEventListener('click',e=>{if(!e.target.closest('.action-wrap'))closeActionMenus();});
window.addEventListener('resize',closeActionMenus);
// EC9: do not close action UI on scroll; mobile scroll events can fire immediately after tap.
function invoiceActionsModal(iid){
  const i=state.invoices.find(x=>x.id===iid);if(!i)return;
  modal(`<div class="big">⋯ إجراءات الفاتورة ${invNo(i)}</div>
    <div class="col">
      <button class="ok" onclick="showInv('${iid}')">🧾 عرض الفاتورة</button>
      <button onclick="printInvoice('${iid}')">🖨 طباعة</button>
      ${canCorrectInvoice()&&i.status!=='voided'?`<button class="btn-warn" onclick="invoiceCorrectionModal('${iid}')">✏ تصحيح موثّق</button><button class="danger" onclick="voidInvoiceModal('${iid}')">⛔ إلغاء موثّق</button>`:''}
      <button class="gray" onclick="closeM()">إغلاق</button>
    </div>`);
}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function owner(){return user&&['Owner','Admin'].includes(user.role)}
function manager(){return user&&user.role==='Manager'}
function canCorrectInvoice(){return !!(owner()||(manager()&&user.canCorrectInvoices===true))}
function cashier(){return user&&user.role==='Cashier'}
function roleLabel(role){return ({Owner:'صاحب النشاط',Admin:'صاحب النشاط',Manager:'مدير',Cashier:'كاشير',Viewer:'مشاهدة فقط'}[role]||role)}
function audit(action, entityType, entityId, summary, details={}){
  if(!state)return null;
  if(!Array.isArray(state.auditLogs))state.auditLogs=[];
  const entry={id:id(),at:new Date().toISOString(),action,entityType,entityId:entityId||'',summary,details,actorId:user?.id||'',actor:user?.username||'system',actorRole:user?.role||'System',cloudSynced:false};
  state.auditLogs.unshift(entry);
  state.auditLogs=state.auditLogs.slice(0,2000);
  return entry;
}
function invActor(i){return i.issuedBy||i.user||'غير محدد — بيانات سابقة'}
function invoiceStartTime(i){
  if(i&&i.start)return i.start;
  const minutes=Number(i&&i.minutes)||0;
  const end=i&&(i.end||i.date);
  if(end&&minutes){
    const t=new Date(end).getTime();
    if(!Number.isNaN(t))return new Date(t-minutes*60000).toISOString();
  }
  return '';
}
function invoiceEndTime(i){return (i&&(i.end||i.date))||'';}
function invoiceStarter(i){return (i&&(i.startedBy||i.startedByLabel||i.started_by_label))||'غير محدد';}
function invoiceEnder(i){return (i&&(i.endedBy||i.endedByLabel||i.ended_by_label))||invActor(i)||'غير محدد';}
function invoiceSessionTypeText(i){
  if(!i)return '—';
  if(i.sessionType==='match')return `مباراة ${Number(i.matchMins)||Number(i.minutes)||0} دقيقة`;
  if(isTimedSession(i))return `وقت محدد ${timedMins(i)} دقيقة`;
  return invoiceMatchCount(i)>0?'جلسة مفتوحة + مباريات إضافية':'جلسة مفتوحة';
}

function invoiceStatusText(i){return i.status==='voided'?'ملغاة':(i.correctionSeq?'مصححة':'مكتملة')}

function sess(did){return state.sessions.find(s=>s.deviceId===did&&s.status==='open')}
function cost(s){
  let elapsed=Math.max(0,(Date.now()-new Date(s.start))/60000); // float minutes elapsed
  let d=state.devices.find(x=>x.id===s.deviceId)||{};
  let play=0;
  let m=Math.ceil(elapsed)||1;
  if(s.sessionType==='match'){
    m=Number(s.matchMins)||m;
    // Match is a fixed-price product: no live accounting timer.
    play=+s.matchPrice||0;
  } else {
    // Open/timed sessions: hourly billing, minimum 5 EGP, rounded up to nearest 5, no fractions.
    // Timed session charges at least the selected duration; overtime is charged if actual time exceeds it.
    let rate=rateForSession(s,d);
    let billMins=isTimedSession(s)?Math.max(elapsed,timedMins(s)):elapsed;
    play=billOpenPlay(billMins/60*(+rate||0));
  }
  // Additional matches are fixed-price match charges, not drinks/add-ons.
  play += matchItemsTotal(s.items||[]);
  let dr=nonMatchItemsTotal(s.items||[]);
  return{m,elapsed,play,dr,total:play+dr,matchAdd:matchItemsTotal(s.items||[]),timedMins:timedMins(s)}
}
function sessionClock(s){
  const seconds=Math.max(0,Math.floor((Date.now()-new Date(s.start))/1000));
  const h=Math.floor(seconds/3600),m=Math.floor((seconds%3600)/60),sec=seconds%60;
  const pad=n=>String(n).padStart(2,'0');
  return h>0?`${h}:${pad(m)}:${pad(sec)}`:`${m}:${pad(sec)}`;
}

const alertedSessions={};

function notificationState(){
  if(!window.isSecureContext)return {code:'insecure',label:'يتطلب HTTPS',cls:'status-bad'};
  if(!('Notification' in window))return {code:'unsupported',label:'غير مدعوم على هذا المتصفح',cls:'status-bad'};
  if(Notification.permission==='granted')return {code:'granted',label:'مفعلة ✓',cls:'status-good'};
  if(Notification.permission==='denied')return {code:'denied',label:'محظورة من المتصفح',cls:'status-bad'};
  return {code:'default',label:'لم يتم السماح بعد',cls:'status-warn'};
}
async function enableNotifications(){
  const current=notificationState();
  if(current.code==='insecure'){showNotice('الإشعارات تحتاج فتح التطبيق من رابط HTTPS.', 'danger');return;}
  if(current.code==='unsupported'){showNotice('الإشعارات غير مدعومة على هذا المتصفح.', 'danger');return;}
  if(current.code==='granted'){showNotice('الإشعارات مفعلة بالفعل ✓', 'success');render();return;}
  if(current.code==='denied'){
    showNotice('الإشعارات محظورة. افتح إعدادات الموقع في Chrome ثم اسمح بالإشعارات.', 'danger');render();return;
  }
  try{
    const result=await Notification.requestPermission();
    render();
    if(result==='granted') showNotice('تم تفعيل التنبيهات بنجاح ✓', 'success');
    else if(result==='denied') showNotice('تم حظر الإشعارات. يمكنك السماح بها من إعدادات الموقع.', 'danger');
    else showNotice('لم يتم منح الإذن. فعّله من إعدادات الموقع عند الحاجة.', 'warn');
  }catch(err){
    render();showNotice('تعذر طلب إذن الإشعارات على هذا المتصفح.', 'danger');
  }
}

function formatOpenReminderDuration(mins){
  mins=Math.max(0,Number(mins)||0);
  const h=Math.floor(mins/60),m=mins%60;
  if(h&&m)return `${h} ساعة و ${m} دقيقة`;
  if(h)return h===1?'ساعة':`${h} ساعة`;
  return `${mins} دقيقة`;
}

function fireAlert(sid,level,deviceName,minsLeft){
  if(!alertedSessions[sid])alertedSessions[sid]={};
  if(alertedSessions[sid][level])return; // already fired
  alertedSessions[sid][level]=true;

  let msg='',icon='⚠️',cls='t-warn';
  if(level==='w2'){msg=`${deviceName}: باقي دقيقتين فقط`;icon='⚠️';cls='t-warn'}
  else if(level==='end'){msg=`${deviceName}: الوقت انتهى!`;icon='🏁';cls='t-end'}
  else if(level==='over'){msg=`${deviceName}: تجاوز الوقت بـ 5 دقائق!`;icon='🚨';cls='t-danger'}
  else if(String(level).startsWith('open')){msg=`${deviceName}: الجلسة المفتوحة وصلت ${formatOpenReminderDuration(minsLeft)}`;icon='⏱️';cls='t-info'}

  // Sound (Web Audio API)
  playBeep(level);
  // Vibration
  if(navigator.vibrate){
    if(level==='w2') navigator.vibrate([300,100,300,100,300]);
    else if(level==='end'||level==='over') navigator.vibrate([500,150,500,150,500,150,500]);
  }
  // Browser Notification
  if('Notification' in window && Notification.permission==='granted'){
    new Notification('PS Cafe Manager — '+deviceName,{body:msg.replace(deviceName+': ',''),icon:'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>'});
  }
  // Toast
  showToast(icon,msg,cls);
}

function playBeep(level){
  try{
    let ctx=new(window.AudioContext||window.webkitAudioContext)();
    let freqs={w2:[660,520,660],end:[800,600,400],over:[400,300,200,300,400]};
    let seq=freqs[level]||[520];
    let t=ctx.currentTime;
    seq.forEach((f,i)=>{
      let o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.frequency.value=f;o.type='sine';
      g.gain.setValueAtTime(0.3,t+i*0.18);
      g.gain.exponentialRampToValueAtTime(0.001,t+i*0.18+0.15);
      o.start(t+i*0.18);o.stop(t+i*0.18+0.15);
    });
    setTimeout(()=>ctx.close(),2000);
  }catch(e){}
}

function showToast(icon,msg,cls){
  let wrap=document.getElementById('alert-toast');
  if(!wrap)return;
  // EC11: compact non-blocking top toast; keep newest 3 only so it never covers bottom actions.
  while(wrap.children.length>=3)wrap.firstElementChild?.remove();
  let el=document.createElement('div');
  el.className='toast-item '+cls;
  el.innerHTML=`<span class="toast-icon">${icon}</span><span>${esc(msg)}</span>`;
  wrap.appendChild(el);
  const life=(cls||'').includes('t-danger')?4200:2600;
  setTimeout(()=>{el.style.opacity='0';el.style.transform='translateY(-6px)';el.style.transition='opacity 0.25s, transform 0.25s';setTimeout(()=>el.remove(),260)},life);
}
function showNotice(msg,type='info'){
  const map={success:['✅','t-ok'],danger:['⚠️','t-danger'],warn:['⏰','t-warn'],info:['ℹ️','t-info']};
  const pair=map[type]||map.info;showToast(pair[0],msg,pair[1]);
}

function checkAlerts(){
  if(!state||!Array.isArray(state.sessions))return;
  state.sessions.filter(s=>s.status==='open').forEach(s=>{
    const d=state.devices.find(x=>x.id===s.deviceId)||{};
    const deviceName=d.name||'الجهاز';
    const elapsed=Math.max(0,(Date.now()-new Date(s.start))/60000);
    if(s.sessionType==='match'||isTimedSession(s)){
      const target=s.sessionType==='match'?(Number(s.matchMins)||0):timedMins(s);
      if(!target)return;
      const left=target-elapsed;
      if(left>0 && left<=2)fireAlert(s.id,'w2',deviceName,Math.ceil(left));
      if(elapsed>=target)fireAlert(s.id,'end',deviceName,0);
      if(elapsed>=target+5)fireAlert(s.id,'over',deviceName,5);
    }else{
      // Open session has no fixed end. Use practical follow-up reminders every 30 minutes.
      const milestone=Math.floor(elapsed/30)*30;
      if(milestone>=30)fireAlert(s.id,'open'+milestone,deviceName,milestone);
    }
  });
}

function miniDeviceCard(d){
  const s=sess(d.id), c=s?cost(s):null, alertCls=s?getDeviceAlertClass(s):'';
  let cls='md-maint', stateText='صيانة', metric='غير متاح', sub='', name=miniDeviceName(d);
  if(s){
    const isEnded=alertCls.includes('overtime')||alertCls.includes('ended');
    const isWarn=alertCls.includes('warn-2');
    if(isEnded){cls='md-ended';stateText='انتهت'}
    else if(isWarn){cls='md-warn';stateText='قربت'}
    else if(s.sessionType==='match'){cls='md-match';stateText='مباراة'}
    else if(isTimedSession(s)){cls='md-timed';stateText='وقت محدد'}
    else {cls='md-open';stateText='مفتوحة'}
    if(s.sessionType==='match'){
      const elapsed=Math.max(0,(Date.now()-new Date(s.start))/60000);
      const total=Number(s.matchMins)||0;
      const left=Math.max(0,Math.ceil(total-elapsed));
      metric=isEnded?'انتهت':(isWarn?`باقي ${left} د`:`${total} د`);
      sub=`${money(c.total)} ج`;
    }else if(isTimedSession(s)){
      metric=isEnded?'انتهت':sessionDisplayClock(s);
      sub=`${timedMins(s)} د • ${money(c.total)} ج`;
    }else{
      metric=sessionClock(s);
      sub=`${money(c.total)} ج`;
    }
  }else if(d.status==='available'){
    cls='md-available';stateText='متاح';metric='جاهز';sub=`S ${money(d.singleRate)} / M ${money(d.multiRate)}`;
  }
  return `<button type="button" class="mini-device-card ${cls}" onclick="openDeviceDetail('${d.id}')" aria-label="${esc(name)}">
    <span class="md-mini-top"><span class="md-name">${esc(name)}</span><span class="md-state">${stateText}</span></span>
    <span class="md-ps5-icon" aria-hidden="true">${miniDeviceSvg()}</span>
    <span class="md-mini-bottom"><span class="md-metric">${metric}</span><span class="md-sub">${sub||'—'}</span></span>
  </button>`;
}

async function startTimedSession(){
  let did=val('tsd');if(!did)return alert('اختار جهاز');
  let mins=+val('sel-timed-mins')||0;if(!mins)return alert('اختار مدة الوقت المحدد');
  const sid=id(),mode=document.getElementById('tsm').value,d=state.devices.find(x=>x.id==did),customer=val('tsc');
  const btn=document.getElementById('btn-start-timed');
  if(btn&&btn.disabled)return;
  if(btn){btn.disabled=true;btn.textContent='جاري البدء…';}
  async function acceptStartedSession(startedSid){
    rememberTimedSession(startedSid,mins);
    const live=(state.sessions||[]).find(x=>x.id===startedSid)||(state.sessions||[]).find(x=>x.deviceId===did&&x.status==='open');
    if(live){live.sessionType='timed';live.matchMins=mins;live.timedMins=mins;live.status='open';}
    closeM();render();showNotice('تم بدء الوقت المحدد والعداد التنازلي ✓','success');
  }
  if(st().mode==='secure_cloud'){
    rememberTimedSession(sid,mins);
    try{
      // RC5.18.8: use direct REST insert for timed sessions to avoid RPC schema-cache/404 issues.
      await startTimedSessionDirectCloud(sid,did,customer,mode,mins);
      await loadCloud(true);
      await acceptStartedSession(sid);
    }catch(e){
      if(isCloudConflictError(e)){
        try{
          await loadCloud(true);
          const existing=(state.sessions||[]).find(x=>x.deviceId===did&&x.status==='open');
          if(existing){
            rememberTimedSession(existing.id,mins);
            existing.sessionType='timed';existing.matchMins=mins;existing.timedMins=mins;
            try{await ensureTimedMarker(existing.id,mins);}catch(me){console.warn('Timed marker after conflict failed',me);}
            await acceptStartedSession(existing.id);
            return;
          }
        }catch(_ignore){}
      }
      forgetTimedSession(sid);
      showNotice('لم يبدأ الوقت المحدد: '+(e.message||e),'danger');
      if(btn){btn.disabled=false;btn.textContent='بدء الوقت المحدد';}
    }
    return;
  }
  const when=new Date().toISOString();
  state.sessions.push({id:sid,deviceId:did,customer,mode,sessionType:'timed',matchMins:mins,timedMins:mins,items:[],start:when,status:'open',user:user.username,startedBy:user.username,startedById:user.id||''});
  d.status='busy';audit('TIMED_SESSION_START','session',sid,'بدء وقت محدد على '+d.name,{deviceId:did,deviceName:d.name,mode,minutes:mins});closeM();save();
}

async function endSession(sid){
  let s=state.sessions.find(x=>x.id==sid);
  if(!s){showNotice('لم يتم العثور على الجلسة. حدّث البيانات وحاول مرة أخرى.','danger');return;}
  let d=state.devices.find(x=>x.id==s.deviceId),c=cost(s);
  if(endingSessions.has(sid))return;
  endingSessions.add(sid);
  try{
    if(st().mode==='secure_cloud'){
      const iid=id();
      showNotice('جاري إنهاء الجلسة وتجهيز الفاتورة…','info');
      // RC5.18.7: do not PATCH timed sessions before completing them. Supabase now stores session_type='timed'.
      // Remove any older hidden timed marker item before completion so the invoice RPC is not blocked by custom marker rows.
      if(isTimedSession(s)){
        rememberTimedSession(sid,timedMins(s));
        const markers=(s.items||[]).filter(isTimedMarker);
        for(const marker of markers){
          try{await rpc('ps_remove_session_item',{p_business:st().businessId,p_id:marker.id});}
          catch(me){console.warn('Timed marker cleanup skipped',me);}
        }
      }
      if(isTimedSession(s)){
        // RC5.18.8: direct REST close for timed sessions to bypass RPC compatibility/cache issues.
        await completeTimedSessionDirectCloud(s,iid);
      }else{
        await rpc('ps_complete_session',{p_business:st().businessId,p_session_id:sid,p_invoice_id:iid,p_payment_method:'Cash'});
      }
      forgetTimedSession(sid);
      delete alertedSessions[sid];
      await loadCloud(true);
      const inv=state.invoices.find(x=>x.id===iid)||state.invoices.find(x=>x.sessionId===sid)||[...state.invoices].reverse()[0];
      showNotice('تم إنهاء الجلسة وفتح الفاتورة تلقائيًا ✓','success');
      if(inv){setTimeout(()=>showInv(inv.id),120);}else{tab='Invoices';tabs();render();showNotice('تم الإنشاء، وتم فتح صفحة الفواتير للمراجعة.','warn');}
      return;
    }
    const now=new Date().toISOString();
    let inv={id:id(),sessionId:s.id,no:state.nextInvoice++,date:now,status:'completed',deviceId:d.id,deviceName:d.name,customer:s.customer,mode:s.mode,sessionType:s.sessionType||'open',matchMins:s.matchMins||null,timedMins:s.timedMins||null,start:s.start,end:now,minutes:c.m,playTotal:+c.play.toFixed(2),drinkTotal:+c.dr.toFixed(2),total:+c.total.toFixed(2),items:cleanVisibleItems(s.items),payment:'Cash',user:user.username,issuedBy:user.username,startedBy:s.startedBy||s.user||'',endedBy:user.username};
    s.status='closed';s.end=inv.end;s.endedBy=user.username;s.invoiceId=inv.id;d.status='available';state.invoices.push(inv);audit('INVOICE_CREATE','invoice',inv.id,'إنشاء فاتورة #'+inv.no+' بواسطة '+user.username,{invoiceNo:inv.no,deviceId:d.id,total:inv.total,sessionId:s.id});delete alertedSessions[sid];save();setTimeout(()=>showInv(inv.id),80);
  }catch(e){
    showNotice('تعذر إنهاء الجلسة: '+(e.message||e),'danger');
  }finally{
    endingSessions.delete(sid);
  }
}

let invoiceFilters={q:'',range:'today',status:'all'};
function setInvoiceFilter(k,v){invoiceFilters[k]=v;rInvoices();}
function invoiceInRange(i,range){
  const d=localBusinessDate(i.date), t=today();
  if(range==='all')return true;
  if(range==='today')return d===t;
  const now=new Date();
  if(range==='yesterday'){
    const y=new Date(now);y.setDate(y.getDate()-1);return d===localBusinessDate(y);
  }
  if(range==='week'){
    const dt=new Date(i.date);return (now-dt)<=7*24*60*60*1000;
  }
  return true;
}
function invoiceFilteredList(){
  const q=(invoiceFilters.q||'').trim().toLowerCase();
  return [...state.invoices].reverse().filter(i=>{
    if(!invoiceInRange(i,invoiceFilters.range))return false;
    if(invoiceFilters.status==='voided'&&i.status!=='voided')return false;
    if(invoiceFilters.status==='corrected'&&!i.correctionSeq)return false;
    if(invoiceFilters.status==='completed'&&(i.status==='voided'||i.correctionSeq))return false;
    if(q){const blob=[i.no,i.deviceName,i.customer,i.total,invoiceStatusText(i),matchCountLabel(invoiceMatchCount(i))].join(' ').toLowerCase();if(!blob.includes(q))return false;}
    return true;
  });
}

async function saveExp(){
  const expense={id:id(),date:val('ed'),type:val('et').trim(),amount:+val('ea'),note:val('en'),createdBy:user.username,createdAt:new Date().toISOString(),voidedAt:null,voidReason:''};

  if(expense.amount<0)return showNotice('قيمة المصروف غير صحيحة.','danger');
  if(st().mode==='secure_cloud'){try{await rpc('ps_add_expense',{p_business:st().businessId,p_id:expense.id,p_date:expense.date,p_type:expense.type,p_amount:expense.amount,p_note:expense.note});closeM();await loadCloud(true);showNotice('تم تسجيل المصروف في سجل الحركات ✓','success');}catch(e){showNotice('تعذر حفظ المصروف: '+e.message,'danger')}return;}

}
function voidExpenseModal(idv){
  if(!owner())return showNotice('إلغاء المصروفات متاح لصاحب النشاط فقط.','danger');
  const e=state.expenses.find(x=>x.id===idv); if(!e||e.voidedAt)return;
  modal(`<div class="big">⛔ إلغاء مصروف موثّق</div>
    <div class="settings-note" style="border-color:rgba(255,61,87,.34);background:rgba(255,61,87,.07)">الإلغاء لا يحذف المصروف. سيظل محفوظًا في السجل ولن يدخل في تقارير المصروفات الفعلية.</div>

    <div class="invoice-row"><span>القيمة</span><strong>${money(e.amount)} ج</strong></div>
    <div class="col mt"><label>ملاحظة الإلغاء (اختياري)</label><textarea id="voidExpReason" rows="3" placeholder="اختياري — مثال: تم تسجيل المصروف بالخطأ"></textarea></div>
    <br><div class="row"><button class="danger" onclick="confirmVoidExpense('${idv}')">⛔ تأكيد الإلغاء وتسجيله</button><button class="gray" onclick="show('Expenses');closeM()">رجوع</button></div>`);

async function confirmVoidExpense(idv){
  if(!owner())return; const e=state.expenses.find(x=>x.id===idv), reason=val('voidExpReason').trim(); if(!e||e.voidedAt)return;
  if(st().mode==='secure_cloud'){try{await rpc('ps_void_expense',{p_business:st().businessId,p_id:idv,p_reason:reason});closeM();await loadCloud(true);showNotice('تم إلغاء المصروف مع تسجيل العملية ✓','success');}catch(err){showNotice('تعذر إلغاء المصروف: '+err.message,'danger')}return;}
  e.voidedAt=new Date().toISOString();e.voidedBy=user.username;e.voidReason=reason;audit('EXPENSE_VOID','expense',idv,'إلغاء مصروف: '+e.type+(reason?' — السبب: '+reason:''),{amount:e.amount,reason});closeM();save();
}

function actorLabel(){return user?.username||'User'}
function invActorLabel(i){return invActor(i)||i.creator_label||i.issuedBy||i.user||''}
function shiftLabelFromRecord(x){return x.closedByLabel||x.closed_by_label||x.cashierLabel||x.actor||''}
function shiftClosedAt(x){return x.closedAt||x.closed_at||x.date||x.created_at||''}
function shiftStartFor(label){
  const rows=(state.shiftClosures||[]).filter(x=>shiftLabelFromRecord(x)===label).sort((a,b)=>new Date(shiftClosedAt(b))-new Date(shiftClosedAt(a)));
  if(rows[0])return shiftClosedAt(rows[0]);
  const first=(state.invoices||[]).filter(i=>i.status!=='voided'&&invActorLabel(i)===label).sort((a,b)=>new Date(a.date)-new Date(b.date))[0];
  return first?first.date:new Date(new Date().setHours(0,0,0,0)).toISOString();
}
function shiftSummary(label=actorLabel(),fromIso=null,toIso=null){
  const from=fromIso||shiftStartFor(label), to=toIso||new Date().toISOString();
  const invoices=(state.invoices||[]).filter(i=>i.status!=='voided'&&invActorLabel(i)===label&&new Date(i.date)>new Date(from)&&new Date(i.date)<=new Date(to)).sort((a,b)=>Number(a.no||0)-Number(b.no||0));
  const playTotal=invoices.reduce((a,i)=>a+(+i.playTotal||0),0);
  const drinkTotal=invoices.reduce((a,i)=>a+(+i.drinkTotal||0),0);
  const total=invoices.reduce((a,i)=>a+(+i.total||0),0);
  return {label,from,to,invoices,invoiceCount:invoices.length,firstInvoiceNo:invoices[0]?.no||0,lastInvoiceNo:invoices[invoices.length-1]?.no||0,playTotal,drinkTotal,total};
}

    try{

      try{await rpc('ps_record_client_event',{p_business:st().businessId,p_action:'SHIFT_CLOSE',p_summary:'تسليم وردية '+closure.closedByLabel+' بإجمالي '+money(closure.total)+' ج'});}catch(_e){}

  }

  state.shiftClosures.unshift(closure);
  audit('SHIFT_CLOSE','shift',closure.id,'تسليم وردية '+s.label+' بإجمالي '+money(s.total)+' ج',{invoiceCount:s.invoiceCount,firstInvoiceNo:s.firstInvoiceNo,lastInvoiceNo:s.lastInvoiceNo,total:s.total,actualCash:actual,difference:actual-s.total});

}

// SUPABASE / NORMALIZED SECURE CLOUD SYNC — V6.4.1
// ============================================================
function friendlySyncError(status,raw){
  const txt=String(raw||'');
  if(status===400&&/invalid|login|credentials/i.test(txt))return 'بيانات دخول السحابة غير صحيحة.';
  if(status===401)return 'انتهت جلسة السحابة أو بيانات الدخول غير صحيحة.';
  if(status===403)return 'الحساب لا يملك صلاحية الوصول إلى بيانات النشاط.';
  if(status===404)return 'خدمة قاعدة البيانات لم تجد العملية المطلوبة. حدّث التطبيق ثم اضغط تحديث البيانات، ولا تشغّل ملف 01_SCHEMA_PRODUCTION.';
  if(/row-level security|rls/i.test(txt))return 'رفضت قاعدة البيانات العملية بسبب الصلاحيات المحددة.';
  if(/Failed to fetch|NetworkError/i.test(txt))return 'تعذر الوصول إلى قاعدة البيانات. افحص الإنترنت أو الرابط.';
  return 'تعذر إتمام العملية ('+status+').';
}

async function authFetch(path,opts={}){
  const s=st();if(!navigator.onLine)throw Error('لا يوجد اتصال بالإنترنت.');
  if(!s.url||!s.key)throw Error('إعدادات قاعدة البيانات غير موجودة على هذا الجهاز.');
  let response;try{response=await fetch(s.url+path,{...opts,headers:{apikey:s.key,'Content-Type':'application/json',...(opts.headers||{})}})}catch(e){throw Error('تعذر الوصول إلى قاعدة البيانات. افحص الإنترنت أو الرابط.')}
  const raw=await response.text();if(!response.ok)throw Error(friendlySyncError(response.status,raw));
  try{return raw?JSON.parse(raw):{}}catch(e){return {}}
}
async function cloudSignInCredentials(email,password){
  let s=st();setSyncMeta({syncing:true,lastError:''});
  const data=await authFetch('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})});
  if(!data.access_token||!data.user)throw Error('لم يتم إنشاء جلسة دخول آمنة.');
  s.session={access_token:data.access_token,refresh_token:data.refresh_token,expires_at:Math.floor(Date.now()/1000)+(data.expires_in||3600),userId:data.user.id,email:data.user.email};s.cloudEmail=email;s.mode='secure_cloud';s.schema='normalized_v2_controlled_corrections';setst(s);return data.user;
}
async function cloudSignIn(password){ return cloudSignInCredentials(st().cloudEmail,password); }
async function cloudSignOut(showMessage=true){
  const s=st();s.session=null;setst(s);setSyncMeta({verified:false,syncing:false,lastError:'',lastSuccess:''});
  if(showMessage)showNotice('تم تسجيل الخروج من قاعدة بيانات النشاط.', 'success');
}
async function ensureCloudToken(){
  let s=st();if(s.mode!=='secure_cloud')throw Error('قاعدة بيانات المالك غير مفعلة.');
  if(!s.session||!s.session.access_token)throw Error('يلزم تسجيل دخول المستخدم إلى قاعدة البيانات.');
  if((s.session.expires_at||0)>Math.floor(Date.now()/1000)+60)return s.session.access_token;
  const data=await authFetch('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:s.session.refresh_token})});
  s.session={...s.session,access_token:data.access_token,refresh_token:data.refresh_token||s.session.refresh_token,expires_at:Math.floor(Date.now()/1000)+(data.expires_in||3600)};setst(s);return s.session.access_token;
}
async function req(method,path,body,prefer='return=representation'){
  const s=st();if(!navigator.onLine)throw Error('لا يوجد اتصال بالإنترنت. البيانات محفوظة على الجهاز.');
  if(!s.url||!s.key||!s.businessId)throw Error('إعدادات قاعدة بيانات النشاط غير مكتملة.');
  const token=await ensureCloudToken();let r;
  try{r=await fetch(s.url+'/rest/v1/'+path,{method,headers:{apikey:s.key,Authorization:'Bearer '+token,'Content-Type':'application/json',Prefer:prefer},body:body?JSON.stringify(body):undefined})}
  catch(err){throw Error('تعذر الوصول إلى قاعدة البيانات. افحص الإنترنت أو الرابط.');}
  const raw=await r.text();if(!r.ok)throw Error(friendlySyncError(r.status,raw));
  try{return raw?JSON.parse(raw):[]}catch(e){return []}
}
async function rpc(name,args){return req('POST','rpc/'+name,args,'return=representation');}

  catch(e){setSyncMeta({verified:false,syncing:false,lastError:e.message});throw e;}
}
async function loadCloud(force=false){
  // RC1 recovery rule: sync is read-only and resilient. Old pending local queues must not block

async function restoreSavedCloudSession(){
  const cfg=st();
  if(cfg.mode!=='secure_cloud'||!cfg.session||!cfg.session.access_token)return false;
  try{
    setSyncMeta({syncing:true,lastError:''});
    await ensureCloudToken();
    const member=await fetchSignedInMember();
    if(!member||!member.active)throw Error('هذا المستخدم غير مفعل في النشاط.');
    user={id:member.user_id,username:member.display_name||cfg.cloudEmail||'User',role:jsRole(member.role),canCorrectInvoices:!!member.can_correct_invoices,active:true,cloud:true};
    showAppScreen();

      await loadCloud(true);
      setSyncMeta({verified:true,syncing:false,lastError:''});
    }catch(loadErr){
      setSyncMeta({verified:true,syncing:false,lastError:loadErr.message||String(loadErr)});

function setupMobileBackNavigation(){
  try{history.replaceState({tab:tab||'Dashboard'},'', location.hash||'#Dashboard');}catch(e){}
  window.addEventListener('popstate',()=>{
    const m=document.getElementById('modal');
    if(m&&!m.classList.contains('hidden')){closeM();try{history.pushState({tab:tab},'', '#'+tab)}catch(e){};return;}

    const now=Date.now();
    if(!window.__lastBackPress||now-window.__lastBackPress>1800){window.__lastBackPress=now;showNotice('اضغط رجوع مرة أخرى للخروج','info');try{history.pushState({tab:'Dashboard'},'', '#Dashboard')}catch(e){};}

}
