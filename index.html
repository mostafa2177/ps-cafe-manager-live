<head>
<meta charset="UTF-8">

<title>PS Cafe Manager • V6.4.2 EC9</title>

<meta name="application-name" content="PS Cafe Manager">
<meta name="description" content="إدارة كافيه بلايستيشن - جلسات مباريات فواتير تقارير">

<meta name="background-color" content="#060b14">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PS Cafe">
<meta name="msapplication-TileColor" content="#060b14">
<meta name="msapplication-tap-highlight" content="no">

<!-- PWA Manifest -->
<link rel="manifest" href="manifest.json?v=6.4.2">

<link rel="apple-touch-icon" href="icon-192.png?v=6.4.2">
<link rel="apple-touch-icon" sizes="152x152" href="icon-192.png?v=6.4.2">
<link rel="apple-touch-icon" sizes="180x180" href="icon-192.png?v=6.4.2">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=6.4.2">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png?v=6.4.2">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-base:#060b14;--bg-surface:#0d1623;--bg-card:#111d2e;--bg-card-hover:#162338;--bg-elevated:#1a2840;
  --border:#1e3050;--border-light:#243a5e;
  --blue:#2979ff;--blue-dark:#1a5fff;--blue-glow:rgba(41,121,255,0.18);--blue-dim:#163a80;
  --green:#00c853;--green-dark:#00a040;--green-dim:#003d1a;--green-glow:rgba(0,200,83,0.15);
  --red:#ff3d57;--red-dark:#cc2040;--red-dim:#4a0a12;
  --orange:#ff9800;--orange-dim:#4a2800;
  --yellow:#ffd600;--yellow-dim:#3d3000;
  --purple:#7c3aed;--purple-dim:#2d1660;
  --text-primary:#e8f0fe;--text-secondary:#8ba3c7;--text-muted:#4a6080;
  --shadow-card:0 4px 24px rgba(0,0,0,0.5);
  --radius:14px;--radius-sm:8px;--radius-lg:18px;--transition:0.18s ease;
}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg-base);color:var(--text-primary);line-height:1.6;min-height:100vh;font-size:15px;}
.hidden{display:none!important}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg-surface)}
::-webkit-scrollbar-thumb{background:var(--border-light);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--blue)}

/* LOGIN */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(ellipse 60% 50% at 30% 40%,rgba(41,121,255,0.08) 0%,transparent 60%),
  radial-gradient(ellipse 50% 60% at 80% 70%,rgba(124,58,237,0.06) 0%,transparent 60%),var(--bg-base);
  position:relative;overflow:hidden;}
.login::before{content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 60px,rgba(30,48,80,0.2) 60px,rgba(30,48,80,0.2) 61px),
  repeating-linear-gradient(90deg,transparent,transparent 60px,rgba(30,48,80,0.2) 60px,rgba(30,48,80,0.2) 61px);pointer-events:none;}
.login-box{background:var(--bg-card);border:1px solid var(--border-light);border-radius:22px;padding:40px 36px;width:min(440px,100%);
  box-shadow:0 24px 64px rgba(0,0,0,0.7),0 0 0 1px rgba(41,121,255,0.08);position:relative;z-index:1;}
.login-logo{text-align:center;margin-bottom:28px;}
.login-icon{font-size:52px;display:block;margin-bottom:10px;filter:drop-shadow(0 0 20px rgba(41,121,255,0.5));}
.login-title{font-size:22px;font-weight:800;color:var(--text-primary);letter-spacing:0.5px;}
.login-sub{font-size:13px;color:var(--text-muted);margin-top:4px;}
.login-divider{height:1px;background:linear-gradient(90deg,transparent,var(--border-light),transparent);margin:20px 0;}
.box{background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--radius-lg);padding:24px;box-shadow:var(--shadow-card);width:min(430px,100%);}

/* FORMS */
label{display:block;font-size:13px;font-weight:600;color:var(--text-secondary);margin-bottom:5px;letter-spacing:0.3px;}
input,select,textarea{font-family:inherit;font-size:14px;border-radius:var(--radius-sm);border:1.5px solid var(--border);padding:10px 14px;background:var(--bg-base);color:var(--text-primary);width:100%;transition:border-color var(--transition),box-shadow var(--transition);outline:none;}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-glow);}
input::placeholder,textarea::placeholder{color:var(--text-muted)}
select option{background:var(--bg-card);color:var(--text-primary)}

/* BUTTONS */
button{font-family:inherit;font-size:14px;font-weight:700;border-radius:var(--radius-sm);border:1.5px solid transparent;padding:10px 18px;cursor:pointer;transition:all var(--transition);letter-spacing:0.3px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;background:var(--blue);color:#fff;border-color:var(--blue);}
button:hover{background:var(--blue-dark);border-color:var(--blue-dark);transform:translateY(-1px);box-shadow:0 4px 14px rgba(41,121,255,0.35);}
button:active{transform:translateY(0);box-shadow:none}
.ok{background:var(--green);border-color:var(--green);color:#fff}
.ok:hover{background:var(--green-dark);border-color:var(--green-dark);box-shadow:0 4px 14px rgba(0,200,83,0.35)}
.danger{background:var(--red);border-color:var(--red);color:#fff}
.danger:hover{background:var(--red-dark);border-color:var(--red-dark);box-shadow:0 4px 14px rgba(255,61,87,0.35)}
.gray{background:var(--bg-elevated);border-color:var(--border-light);color:var(--text-secondary)}
.gray:hover{background:var(--border-light);border-color:var(--border);color:var(--text-primary);box-shadow:none}
.btn-lg{padding:13px 24px;font-size:16px;border-radius:var(--radius);width:100%}
.btn-warn{background:var(--yellow-dim);border-color:rgba(255,214,0,0.3);color:var(--yellow)}
.btn-warn:hover{background:var(--yellow);color:#000;box-shadow:0 4px 14px rgba(255,214,0,0.3)}

/* TOP BAR */
.top{position:sticky;top:0;background:rgba(6,11,20,0.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;justify-content:space-between;align-items:center;z-index:50;gap:12px;}
.top-brand{display:flex;align-items:center;gap:10px}
.top-brand-icon{font-size:26px;filter:drop-shadow(0 0 10px rgba(41,121,255,0.5))}
.top-brand-name{font-size:18px;font-weight:800;color:var(--text-primary);letter-spacing:0.3px}
.top-meta{font-size:12px;color:var(--text-muted);margin-top:2px}
.top-meta span{color:var(--text-secondary)}
.top-actions{display:flex;gap:8px;align-items:center}

/* TABS */
.tabs{display:flex;gap:4px;overflow-x:auto;padding:10px 16px;background:var(--bg-surface);border-bottom:1px solid var(--border);scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;background:transparent;border:1.5px solid transparent;color:var(--text-muted);font-size:13px;font-weight:600;padding:8px 16px;border-radius:var(--radius-sm);cursor:pointer;transition:all var(--transition);letter-spacing:0.3px;}
.tab:hover{background:var(--bg-elevated);color:var(--text-primary);transform:none;box-shadow:none;}
.tab.active{background:var(--blue-dim);border-color:var(--blue);color:#fff;box-shadow:0 0 12px var(--blue-glow);}
.tab.active:hover{background:var(--blue-dim);box-shadow:0 0 12px var(--blue-glow)}

/* CONTENT */
.content{padding:20px;max-width:1340px;margin:0 auto;}

/* CARD */
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow-card);transition:border-color var(--transition);}

/* DEVICE CARDS */
.device-card{background:var(--bg-card);border:1.5px solid var(--border);border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow-card);transition:all 0.25s ease;position:relative;overflow:hidden;}
.device-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--border);transition:background 0.25s ease;}
.device-card.available{border-color:rgba(0,200,83,0.25)}
.device-card.available::before{background:linear-gradient(90deg,var(--green),var(--green-dark))}
.device-card.busy{border-color:rgba(255,152,0,0.3);background:linear-gradient(160deg,var(--bg-card) 60%,rgba(255,152,0,0.04))}
.device-card.busy::before{background:linear-gradient(90deg,var(--orange),#ff6d00)}
.device-card.maintenance{border-color:rgba(255,61,87,0.2)}
.device-card.maintenance::before{background:var(--red)}

/* ALERT STATES */
.device-card.warn-10{border-color:rgba(255,214,0,0.5)!important;background:linear-gradient(160deg,var(--bg-card) 60%,rgba(255,214,0,0.04))!important}
.device-card.warn-10::before{background:linear-gradient(90deg,var(--yellow),#ffab00)!important}
.device-card.warn-5{border-color:rgba(255,61,87,0.6)!important;background:linear-gradient(160deg,var(--bg-card) 60%,rgba(255,61,87,0.07))!important}
.device-card.warn-5::before{background:linear-gradient(90deg,var(--red),#ff6b7a)!important}
.device-card.overtime{border-color:rgba(255,61,87,0.8)!important}
.device-card.overtime::before{background:linear-gradient(90deg,var(--red),var(--red-dark))!important}

/* Session timer colors */
.session-timer{font-size:30px;font-weight:900;color:var(--orange);text-shadow:0 0 20px rgba(255,152,0,0.3);margin:6px 0;font-variant-numeric:tabular-nums;}
.session-timer.warn-10-txt{color:var(--yellow);text-shadow:0 0 20px rgba(255,214,0,0.4);}
.session-timer.warn-5-txt{color:var(--red);text-shadow:0 0 20px rgba(255,61,87,0.5);}
.session-timer.overtime-txt{color:var(--red);animation:blinkRed 0.8s ease-in-out infinite;text-shadow:0 0 24px rgba(255,61,87,0.7);}
@keyframes blinkRed{0%,100%{opacity:1}50%{opacity:0.4}}

/* Match badge */
.match-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700;background:rgba(124,58,237,0.15);border:1px solid rgba(124,58,237,0.3);color:#a78bfa;margin-top:4px;}

/* Progress bar for match sessions */
.match-progress-wrap{background:var(--bg-base);border-radius:999px;height:6px;margin:8px 0 4px;overflow:hidden;border:1px solid var(--border);}
.match-progress-bar{height:100%;border-radius:999px;transition:width 1s linear,background 0.5s;}
.match-progress-bar.ok-bar{background:linear-gradient(90deg,var(--green),#69f0ae);}
.match-progress-bar.warn10-bar{background:linear-gradient(90deg,var(--yellow),#ffcc02);}
.match-progress-bar.warn5-bar{background:linear-gradient(90deg,var(--red),#ff6b7a);}
.match-progress-bar.over-bar{background:var(--red);animation:blinkRed 0.8s ease-in-out infinite;}

.device-card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:8px}
.device-name{font-size:17px;font-weight:800;color:var(--text-primary)}
.device-rate{font-size:11px;color:var(--text-muted);margin-top:2px}
.device-divider{height:1px;background:var(--border);margin:12px 0}
.session-info{font-size:13px;color:var(--text-secondary);line-height:1.8}
.session-info strong{color:var(--text-primary)}
.session-cost{font-size:12px;color:var(--text-muted);margin-bottom:8px}
.session-total{font-size:22px;font-weight:900;color:var(--green);text-shadow:0 0 16px rgba(0,200,83,0.25);margin:4px 0 10px;}
.device-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.device-actions button{flex:1;min-width:80px;padding:9px 12px;font-size:13px}
.device-start-btn{width:100%;margin-top:10px;padding:11px;background:linear-gradient(135deg,var(--green-dim),rgba(0,200,83,0.12));border-color:rgba(0,200,83,0.3);color:var(--green);font-size:14px;}
.device-start-btn:hover{background:var(--green);color:#fff;box-shadow:0 4px 18px rgba(0,200,83,0.35)}

/* Alert notification toast */
#alert-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;width:min(420px,calc(100vw - 32px));}
.toast-item{background:var(--bg-elevated);border:1.5px solid var(--border-light);border-radius:var(--radius);padding:12px 16px;box-shadow:0 8px 32px rgba(0,0,0,0.6);display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;animation:toastIn 0.3s ease;pointer-events:auto;}
.toast-item.t-warn{border-color:rgba(255,214,0,0.4);background:rgba(60,40,0,0.95);}
.toast-item.t-danger{border-color:rgba(255,61,87,0.5);background:rgba(60,10,18,0.95);}
.toast-item.t-end{border-color:rgba(255,152,0,0.5);background:rgba(50,25,0,0.95);}
.toast-icon{font-size:20px;flex-shrink:0}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* Session type select buttons */
.type-toggle{display:flex;gap:0;border-radius:var(--radius-sm);overflow:hidden;border:1.5px solid var(--border);}
.type-toggle button{border-radius:0;border:none;background:var(--bg-base);color:var(--text-muted);flex:1;padding:9px;font-size:13px;}
.type-toggle button.sel{background:var(--blue-dim);color:#fff;border-bottom:2px solid var(--blue);}
.type-toggle button:hover:not(.sel){background:var(--bg-elevated);transform:none;box-shadow:none;}

/* KPI */
.kpi{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;position:relative;overflow:hidden;transition:border-color var(--transition),transform var(--transition);}
.kpi::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--blue),var(--purple));}
.kpi:hover{border-color:var(--border-light);transform:translateY(-2px)}
.kpi-label{font-size:12px;color:var(--text-muted);font-weight:600;letter-spacing:0.5px;text-transform:uppercase}
.kpi b{font-size:26px;font-weight:900;display:block;margin-top:6px;color:var(--text-primary);font-variant-numeric:tabular-nums;}
.kpi-green::after{background:linear-gradient(90deg,var(--green),#00e676)}.kpi-green b{color:var(--green)}
.kpi-red::after{background:linear-gradient(90deg,var(--red),#ff6b7a)}.kpi-red b{color:var(--red)}
.kpi-orange::after{background:linear-gradient(90deg,var(--orange),#ffcc02)}.kpi-orange b{color:var(--orange)}

/* LAYOUT */
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.col{display:flex;flex-direction:column;gap:8px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
.mb{margin-bottom:16px}.mt{margin-top:16px}

/* TYPOGRAPHY */
.big{font-size:20px;font-weight:800;color:var(--text-primary);letter-spacing:0.2px}
.section-title{font-size:18px;font-weight:800;color:var(--text-primary)}
.muted{color:var(--text-muted)}.small{font-size:12px}.price{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums}

/* BADGES */
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;}
.b-ok{background:var(--green-dim);color:var(--green);border:1px solid rgba(0,200,83,0.2)}
.b-busy{background:var(--orange-dim);color:var(--orange);border:1px solid rgba(255,152,0,0.2)}
.b-bad{background:var(--red-dim);color:var(--red);border:1px solid rgba(255,61,87,0.15)}

/* SYNC */
.sync{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;background:var(--bg-elevated);border:1px solid var(--border);padding:4px 10px;border-radius:999px;letter-spacing:0.3px;}
.sync::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--text-muted);display:inline-block}
.sync.on{background:var(--green-dim);border-color:rgba(0,200,83,0.2);color:var(--green)}.sync.on::before{background:var(--green);box-shadow:0 0 6px var(--green)}
.sync.warn{background:var(--orange-dim);border-color:rgba(255,152,0,0.2);color:var(--orange)}.sync.warn::before{background:var(--orange)}
.sync.err{background:var(--red-dim);border-color:rgba(255,61,87,0.15);color:var(--red)}.sync.err::before{background:var(--red)}

/* TABLES */
.tw{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-surface);}
table{width:100%;border-collapse:collapse;min-width:600px;}
th{background:var(--bg-base);padding:12px 16px;text-align:right;font-size:12px;font-weight:700;color:var(--text-muted);letter-spacing:0.6px;text-transform:uppercase;border-bottom:1px solid var(--border);white-space:nowrap;}
td{border-bottom:1px solid rgba(30,48,80,0.5);padding:12px 16px;text-align:right;font-size:14px;color:var(--text-secondary);transition:background var(--transition);}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(41,121,255,0.04);color:var(--text-primary)}
td button{padding:6px 12px;font-size:12px}

/* MODAL */
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:999;animation:fadeIn 0.15s ease;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal .box{max-height:90vh;overflow-y:auto;width:min(720px,100%);background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--radius-lg);padding:28px;box-shadow:0 32px 80px rgba(0,0,0,0.8),0 0 0 1px rgba(41,121,255,0.08);animation:slideUp 0.2s ease;}
@keyframes slideUp{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal .big{margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.modal .grid{margin-bottom:16px}

/* PAGE HEADERS */
.page-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:20px;}
.page-subtitle{font-size:13px;color:var(--text-muted);margin-top:3px}

/* DASH */
.dash-header{background:linear-gradient(135deg,var(--bg-card) 0%,rgba(41,121,255,0.05) 100%);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px 24px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
.dash-header-title{font-size:22px;font-weight:900;color:var(--text-primary)}
.dash-header-sub{font-size:13px;color:var(--text-muted);margin-top:3px}

/* SETTINGS */
.settings-section{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px;}
.settings-note{background:rgba(41,121,255,0.06);border:1px solid rgba(41,121,255,0.15);border-radius:var(--radius-sm);padding:12px 14px;font-size:13px;color:var(--text-secondary);margin-bottom:14px;line-height:1.7;}

/* INVOICE */
.invoice-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--border);font-size:14px;color:var(--text-secondary);}
.invoice-row:last-of-type{border-bottom:none}
.invoice-total-row{display:flex;justify-content:space-between;padding:10px 0 0;margin-top:6px;border-top:2px solid var(--border-light);font-size:20px;font-weight:900;color:var(--green);}

/* Match pricing table in modal */
.match-price-table{border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;margin-top:10px;}
.match-price-row{display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border);gap:10px;cursor:pointer;transition:background var(--transition);}
.match-price-row:last-child{border-bottom:none}
.match-price-row:hover{background:var(--bg-elevated)}
.match-price-row.sel{background:var(--blue-dim);border-right:3px solid var(--blue);}
.match-price-row input[type=radio]{accent-color:var(--blue);width:16px;height:16px;flex-shrink:0;}
.match-price-label{flex:1;font-weight:700;font-size:14px}
.match-price-mins{font-size:12px;color:var(--text-muted);white-space:nowrap;}
.match-price-val{font-size:15px;font-weight:800;color:var(--blue);white-space:nowrap;}


/* V6.2.0 — Owner-controlled production foundation */
.version-pill{display:inline-flex;align-items:center;margin-right:6px;padding:2px 7px;border-radius:999px;font-size:10px;font-weight:800;background:var(--blue-dim);color:#8ab4ff;border:1px solid rgba(41,121,255,.35);vertical-align:middle}
.status-panel{margin-top:12px;padding:12px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg-base);font-size:13px;line-height:1.8;color:var(--text-secondary)}
.status-panel strong{color:var(--text-primary)}
.status-good{border-color:rgba(0,200,83,.28);background:rgba(0,200,83,.05)}
.status-warn{border-color:rgba(255,152,0,.30);background:rgba(255,152,0,.05)}

.settings-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

.btn-blue{background:var(--blue-dim);border-color:rgba(41,121,255,.40);color:#b9d4ff}

.sync.pending{background:var(--orange-dim);border-color:rgba(255,152,0,.2);color:var(--orange)}.sync.pending::before{background:var(--orange)}
.sync.unknown{background:var(--bg-elevated);border-color:var(--border-light);color:var(--text-secondary)}.sync.unknown::before{background:var(--text-muted)}
.toast-item.t-ok{border-color:rgba(0,200,83,.45);background:rgba(0,50,24,.96)}

/* V6.2.0 — Owner-controlled production foundation & restored branding */
.brand-avatar{display:block;object-fit:cover;border-radius:50%;border:1px solid rgba(41,121,255,.46);box-shadow:0 0 20px rgba(41,121,255,.32),0 0 12px rgba(124,58,237,.22)}
.login-avatar{width:92px;height:92px;margin:0 auto 13px}
.top-avatar{width:47px;height:47px;flex-shrink:0}
.login-legal{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px solid var(--border);font-size:12px}
.text-link{background:none!important;border:none!important;padding:0!important;color:var(--text-secondary)!important;font-size:12px!important;font-weight:600;box-shadow:none!important;transform:none!important;text-decoration:underline;cursor:pointer}
.text-link:hover{color:#9fc3ff!important;box-shadow:none!important;transform:none!important}
.owner-card{background:linear-gradient(145deg,var(--bg-card),rgba(41,121,255,.035));border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;margin-bottom:14px}
.owner-only-tag{display:inline-flex;padding:3px 9px;border-radius:999px;background:var(--purple-dim);color:#c4b5fd;border:1px solid rgba(124,58,237,.35);font-size:11px;font-weight:700}
.owner-tech summary{cursor:pointer;list-style:none;font-weight:800;font-size:16px;color:var(--text-primary);display:flex;justify-content:space-between;align-items:center}

.policy-text{font-size:14px;line-height:2;color:var(--text-secondary)}

.policy-text ul{padding-right:20px}
.role-owner{background:var(--purple-dim);color:#c4b5fd;border-color:rgba(124,58,237,.28)}
.sync.private-cloud{background:var(--green-dim);border-color:rgba(0,200,83,.2);color:var(--green)}


/* V6.4.2 — Flexible Shift Handover */
.shift-hero{background:linear-gradient(135deg,var(--bg-card),rgba(0,200,83,.055));border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;margin-bottom:16px;box-shadow:var(--shadow-card)}
.shift-period{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;color:var(--text-secondary);font-size:13px}
.shift-period span{background:var(--bg-base);border:1px solid var(--border);border-radius:999px;padding:5px 10px}
.shift-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.shift-actions button{width:100%}
.cashier-mini-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}

.cashier-mini-card b{display:block;font-size:18px;margin-top:4px;color:var(--text-primary)}
.cashier-mini-card .mini-label{font-size:11px;color:var(--text-muted);font-weight:700}
@media(max-width:850px){.shift-actions{grid-template-columns:1fr}.cashier-mini-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.cashier-mini-grid{grid-template-columns:1fr}.shift-period span{width:100%;text-align:center}}


/* V6.4.2-EC2 — Compact dashboard and clickable operational cards */
.compact-hero{padding:14px 18px!important;margin-bottom:12px!important;min-height:auto!important}
.compact-hero .dash-header-title{font-size:24px}
.compact-hero .dash-header-sub,.compact-hidden-sub{display:none!important}
.compact-kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:0 0 12px}
.click-card{cursor:pointer;user-select:none;transition:transform .16s ease,border-color .16s ease,background .16s ease,box-shadow .16s ease}
.click-card:hover{transform:translateY(-2px);border-color:var(--blue)!important;box-shadow:0 8px 26px rgba(41,121,255,.16)}
.click-card:active{transform:translateY(0)}
.compact-metric{background:var(--bg-surface);border:1px solid var(--border);border-radius:14px;padding:12px 14px;min-height:78px;position:relative;overflow:hidden}
.compact-metric::before{content:'';position:absolute;top:0;right:0;left:0;height:3px;background:var(--blue)}
.compact-metric.green::before{background:var(--green)}.compact-metric.orange::before{background:var(--orange)}.compact-metric.purple::before{background:var(--purple)}.compact-metric.red::before{background:var(--red)}
.compact-metric .metric-title{font-size:12px;color:var(--text-muted);font-weight:800;margin-bottom:5px}
.compact-metric .metric-value{font-size:26px;font-weight:900;color:var(--text-primary);line-height:1.15}.compact-metric.green .metric-value{color:var(--green)}.compact-metric.red .metric-value{color:var(--red)}.compact-metric.orange .metric-value{color:var(--orange)}.compact-metric.purple .metric-value{color:#a78bfa}
.compact-metric .metric-arrow{position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--text-muted)}
.kpi.click-card{min-height:92px;padding:13px 16px}.kpi.click-card .kpi-label{font-size:11px}.kpi.click-card b{font-size:24px}
.shift-hero.compact-shift{padding:14px;margin-bottom:12px}.shift-hero.compact-shift .page-header{margin-bottom:8px}.shift-hero.compact-shift .page-subtitle{display:none}
.cashier-mini-card.click-card{min-height:62px;padding:10px 12px}.cashier-mini-card.click-card b{font-size:17px}
.device-card .muted.small[style*="text-align:center"]{padding:3px 0!important}
.device-divider{margin:9px 0}
.content{padding-top:14px}
.page-header{margin-bottom:12px}.page-subtitle{font-size:12px}.dash-header{margin-bottom:12px}
@media(max-width:900px){.compact-kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.compact-metric{min-height:72px;padding:10px 12px}.compact-metric .metric-value{font-size:22px}}
@media(max-width:520px){.compact-kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.compact-hero{padding:12px!important}.compact-hero .row{display:grid;grid-template-columns:1fr 1fr;width:100%}.compact-hero .row button{width:100%;padding:9px 10px}.cashier-mini-grid{gap:8px;margin-bottom:10px}.shift-actions{gap:8px}}


/* EC9 — hard lock owner technical tools open; no details/summary collapse regressions */
details.owner-tech{display:block!important;}
details.owner-tech>summary{display:none!important;}
.owner-tech,.owner-tech-open{display:block!important;overflow:visible!important;}
.owner-tech-header{cursor:default!important;}
.owner-tech-header::after,.owner-tech summary::after{display:none!important;content:''!important;}
.owner-tech .settings-section{display:block!important;}
#vSettings .owner-card.owner-tech{min-height:auto!important;}
/* EC9 — cleaner compact cards */

.ops-card .hint{display:none!important;}
.ops-card{min-height:72px!important;padding:10px 12px!important;}
.dash-header{padding:14px 18px!important;margin-bottom:14px!important;}

  .top,.tabs,button,.no-print,#sl,.top-actions,#alert-toast{display:none!important}

@media(max-width:850px){
  .g2,.g3,.g5{grid-template-columns:1fr}
  .top{flex-direction:column;align-items:stretch;gap:10px;padding:12px}
  .top-brand,.top-actions{justify-content:space-between}
  .top-actions{flex-wrap:wrap}
  .top-actions button{flex:1}
  .content{padding:12px}
  .device-card{padding:14px}
  .session-timer{font-size:26px}
  .session-total{font-size:18px}

}

/* Pulse animations */
@keyframes pulseBorder{0%,100%{box-shadow:0 4px 24px rgba(0,0,0,0.5),0 0 0 0 rgba(255,152,0,0)}50%{box-shadow:0 4px 24px rgba(0,0,0,0.5),0 0 0 4px rgba(255,152,0,0.06)}}
.device-card.busy:not(.warn-5):not(.overtime){animation:pulseBorder 3s ease-in-out infinite}
@keyframes pulseWarn{0%,100%{box-shadow:0 4px 24px rgba(0,0,0,0.5),0 0 0 0 rgba(255,214,0,0)}50%{box-shadow:0 4px 24px rgba(0,0,0,0.5),0 0 0 6px rgba(255,214,0,0.1)}}
.device-card.warn-10{animation:pulseWarn 1.5s ease-in-out infinite}
@keyframes pulseDanger{0%,100%{box-shadow:0 4px 24px rgba(0,0,0,0.5),0 0 0 0 rgba(255,61,87,0)}50%{box-shadow:0 4px 24px rgba(0,0,0,0.5),0 0 0 8px rgba(255,61,87,0.15)}}
.device-card.warn-5,.device-card.overtime{animation:pulseDanger 0.8s ease-in-out infinite}
[dir=rtl] th,[dir=rtl] td{text-align:right}

<body>

<div id="login" class="login">
  <div class="login-box">
    <div class="login-logo">
      <img class="brand-avatar login-avatar" src="brand-avatar.png" alt="PS Cafe Manager">
      <div class="login-title">PS Cafe Manager</div>
      <div class="login-sub">إدارة تشغيل الكافيه والفواتير</div>
    </div>
    <div class="login-divider"></div>
    <div class="col">
      <div><label>اسم المستخدم / البريد الإلكتروني بعد الربط</label><input id="lu" value="admin" autocomplete="username"></div>
      <div><label>كلمة المرور</label><input id="lp" type="password" placeholder="كلمة المرور" autocomplete="current-password"></div>
      <button class="btn-lg ok" onclick="login()" style="margin-top:4px">🔑 دخول</button>
      <div id="lm" class="small" style="color:#ff8a9a;text-align:center;min-height:18px"></div>
    </div>
    <div class="login-legal">
      <button class="text-link" onclick="showPolicy('terms')">شروط الاستخدام</button>
      <button class="text-link" onclick="showPolicy('privacy')">سياسة الخصوصية</button>
      <button class="text-link" onclick="showPolicy('support')">الدعم والملكية</button>
    </div>
    <div style="margin-top:12px;text-align:center"><button class="gray" style="font-size:12px" onclick="cloudDeviceSetupModal()">🔒 ربط جهاز بقاعدة بيانات المحل</button></div>
  </div>
</div>

<div id="app" class="hidden">
  <div class="top">
    <div class="top-brand">
      <img class="brand-avatar top-avatar" src="brand-avatar.png" alt="PS Cafe Manager">
      <div>
        <div class="top-brand-name">PS Cafe Manager</div>
        <div class="top-meta small">المستخدم: <span id="cu"></span>&nbsp;|&nbsp;<span id="cr"></span>&nbsp;|&nbsp;<span id="sl" class="sync">Offline</span></div>
      </div>
    </div>
    <div class="top-actions no-print">
      <button class="gray" onclick="manualSync()">🔄 مزامنة</button>
      <button class="danger" onclick="logout()">خروج</button>
    </div>
  </div>
  <div id="tabs" class="tabs no-print"></div>
  <div class="content">
    <section id="vDashboard"></section>
    <section id="vProducts" class="hidden"></section>
    <section id="vDevices" class="hidden"></section>
    <section id="vInvoices" class="hidden"></section>
    <section id="vExpenses" class="hidden"></section>
    <section id="vReports" class="hidden"></section>
    <section id="vShifts" class="hidden"></section>
    <section id="vAudit" class="hidden"></section>
    <section id="vUsers" class="hidden"></section>
    <section id="vSettings" class="hidden"></section>
  </div>
</div>

<div id="modal" class="modal hidden"><div id="mc" class="box"></div></div>
<div id="alert-toast"></div>

<script>
// ============================================================
// CORE STATE & STORAGE
// ============================================================
const APP_VERSION='V6.4.2-EC9';
const K='ps_cafe_v4_state', SK='ps_cafe_v4_settings', QK='ps_cafe_v4_sync_queue', SMK='ps_cafe_v4_sync_meta';
const CLOUD_AUDIT_TABLE='ps_audit_logs';
let state,user=null,tab='Dashboard',dirty=false,timer=null,swRegistration=null,installPromptEvent=null,cloudMembers=[];

function syncMeta(){try{return JSON.parse(localStorage.getItem(SMK))||{verified:false,lastSuccess:'',lastError:'',syncing:false}}catch(e){return{verified:false,lastSuccess:'',lastError:'',syncing:false}}}
function setSyncMeta(patch){let m={...syncMeta(),...patch};localStorage.setItem(SMK,JSON.stringify(m));if(user)render();return m}
function shortTime(iso){return iso?new Date(iso).toLocaleString('ar-EG',{dateStyle:'short',timeStyle:'short'}):'—'}

function id(){return 'id_'+Math.random().toString(36).slice(2)+Date.now().toString(36)}

// DEFAULT match pricing configs per device: {mins, single, multi}
const DEF_MATCH_PRICES=[
  {mins:15,single:15,multi:25},
  {mins:30,single:25,multi:40},
  {mins:45,single:35,multi:55},
  {mins:60,single:45,multi:70}
];

function def(){
  return{
    users:[
      {id:id(),username:'admin',password:'1234',role:'Owner',active:true},
      {id:id(),username:'cashier',password:'1234',role:'Cashier',active:true}
    ],
    devices:[1,2,3,4,5].map(n=>({
      id:'ps'+n,name:'PS '+n,status:'available',singleRate:60,multiRate:90,
      matchPrices:DEF_MATCH_PRICES.map(x=>({...x}))
    })),
    products:['شاي:15','قهوة:25','نسكافيه:30','مياه:10','عصير:20','كانز:25'].map(x=>{
      let a=x.split(':');return{id:id(),name:a[0],price:+a[1],stock:0,active:true}
    }),
    profile:{businessName:'PS Cafe',ownerName:'',phone:'',address:''},sessions:[],invoices:[],expenses:[],shiftClosures:[],auditLogs:[],nextInvoice:1,updatedAt:new Date().toISOString()
  }
}

function load(){try{state=JSON.parse(localStorage.getItem(K))||def()}catch(e){state=def()}
  if(!state.profile)state.profile={businessName:'PS Cafe',ownerName:'',phone:'',address:''};
  if(!Array.isArray(state.auditLogs))state.auditLogs=[];
  if(!Array.isArray(state.shiftClosures))state.shiftClosures=[];
  state.users=(state.users||[]).map(u=>({...u,role:u.role==='Admin'?'Owner':u.role}));
  state.devices.forEach(d=>{if(!d.matchPrices)d.matchPrices=DEF_MATCH_PRICES.map(x=>({...x}))});
  save(false)
}
function save(md=true){state.updatedAt=new Date().toISOString();localStorage.setItem(K,JSON.stringify(state));if(md){dirty=true;markPending('تغيير محلي');sched()}render()}
function baseSettings(){return {mode:'offline',url:'',key:'',businessId:'',cloudEmail:'',session:null,schema:'normalized_v1'}}
function st(){try{return {...baseSettings(),...(JSON.parse(localStorage.getItem(SK))||{})}}catch(e){return baseSettings()}}
function setst(s){localStorage.setItem(SK,JSON.stringify({...baseSettings(),...s}));setup();render()}
function money(n){return (Number(n)||0).toFixed(2)}
function fmt(d){return d?new Date(d).toLocaleString('ar-EG'):''}
function today(){return new Date().toISOString().slice(0,10)}
function val(x){return document.getElementById(x)?.value||''}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function owner(){return user&&['Owner','Admin'].includes(user.role)}
function manager(){return user&&user.role==='Manager'}
function cashier(){return user&&user.role==='Cashier'}
function roleLabel(role){return ({Owner:'صاحب النشاط',Admin:'صاحب النشاط',Manager:'مدير',Cashier:'كاشير',Viewer:'مشاهدة فقط'}[role]||role)}
function audit(action, entityType, entityId, summary, details={}){
  if(!state)return null;
  if(!Array.isArray(state.auditLogs))state.auditLogs=[];
  if(!Array.isArray(state.shiftClosures))state.shiftClosures=[];
  const entry={id:id(),at:new Date().toISOString(),action,entityType,entityId:entityId||'',summary,details,actorId:user?.id||'',actor:user?.username||'system',actorRole:user?.role||'System',cloudSynced:false};
  state.auditLogs.unshift(entry);
  state.auditLogs=state.auditLogs.slice(0,2000);
  return entry;
}
function invActor(i){return i.issuedBy||i.user||'غير محدد — بيانات سابقة'}
function invNo(i){return Number(i.no)>0?('#'+i.no):'قيد الاعتماد السحابي'}
function allowedTabs(){
  if(owner())return ['Dashboard','Products','Devices','Invoices','Expenses','Reports','Shifts','Audit','Users','Settings'];
  if(manager())return ['Dashboard','Products','Devices','Invoices','Expenses','Reports','Shifts'];
  if(cashier())return ['Dashboard','Products','Invoices','Shifts'];
  return ['Dashboard','Invoices','Reports'];
}

// ============================================================
// AUTH
// ============================================================
async function login(){
  const identifier=val('lu').trim(), p=val('lp'), cfg=st();
  lm.textContent='';
  if(cfg.mode==='secure_cloud'){
    if(!identifier||!p){lm.textContent='اكتب البريد الإلكتروني وكلمة المرور';return;}
    try{
      await cloudSignInCredentials(identifier,p);
      const member=await fetchSignedInMember();
      if(!member||!member.active)throw Error('هذا المستخدم غير مفعل في النشاط.');
      user={id:member.user_id,username:member.display_name||identifier,role:jsRole(member.role),active:true,cloud:true};
      document.getElementById('login').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
      tab='Dashboard';tabs();setup();
      await loadCloud(true);
      audit('LOGIN','auth',user.id,'تسجيل دخول: '+user.username);
      save();
      return;
    }catch(e){lm.textContent=e.message||'تعذر تسجيل الدخول السحابي';return;}
  }
  let u=identifier.toLowerCase();
  let x=state.users.find(a=>a.username.toLowerCase()==u&&a.password==p&&a.active);
  if(!x){lm.textContent='بيانات الدخول غير صحيحة';return}
  user=x;
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  tab='Dashboard';tabs();setup();
  audit('LOGIN','auth',x.id,'تسجيل دخول: '+x.username);
  save();
  if(p==='1234')showNotice('تنبيه أمان: يجب على صاحب النشاط تغيير كلمة المرور الافتراضية قبل الاستخدام الحقيقي.', 'warn');
}
function jsRole(role){return ({owner:'Owner',manager:'Manager',cashier:'Cashier',viewer:'Viewer'}[role]||'Viewer')}
async function logout(){
  if(user){audit('LOGOUT','auth',user.id,'تسجيل خروج: '+user.username);save();}
  if(st().mode==='secure_cloud'){await cloudSignOut(false);}
  user=null;document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden');
}

// ============================================================
// TABS & RENDER
// ============================================================
function tabs(){
  let all=[['Dashboard','🏠 الرئيسية'],['Products','🥤 المشروبات'],['Devices','🎮 الأجهزة'],['Invoices','🧾 الفواتير'],['Expenses','💸 المصروفات'],['Reports','📊 التقارير'],['Shifts','🔁 الورديات'],['Audit','🛡️ سجل الحركات'],['Users','👥 المستخدمين'],['Settings','🏪 إدارة النشاط']];
  let allowed=allowedTabs();
  document.getElementById('tabs').innerHTML=all.filter(t=>allowed.includes(t[0])).map(t=>`<button class="tab ${tab==t[0]?'active':''}" onclick="show('${t[0]}')">${t[1]}</button>`).join('')
}
function show(t){if(!allowedTabs().includes(t)){showNotice('ليست لديك صلاحية لفتح هذه الصفحة.', 'danger');return;}tab=t;tabs();render()}
function openOperationalPage(target){
  if(target==='Invoices')return show('Invoices');
  if(target==='Expenses')return show('Expenses');
  if(target==='Reports')return show('Reports');
  if(target==='Shifts')return show('Shifts');
  if(target==='Products')return show('Products');
  if(target==='Devices')return show('Devices');
  show('Dashboard');
}
function focusDashboardCards(kind){
  show('Dashboard');
  setTimeout(()=>{
    const selector = kind==='busy' ? '.device-card.busy' : kind==='available' ? '.device-card.available' : '.device-card';
    const el=document.querySelector(selector);
    if(el)el.scrollIntoView({behavior:'smooth',block:'center'});

function render(){
  if(!user)return;
  if(!allowedTabs().includes(tab))tab='Dashboard';
  cu.textContent=user.username;cr.textContent=roleLabel(user.role);
  let ss=st(),online=navigator.onLine,sm=syncMeta();
  // EC9: secure cloud saves actions directly; do not show stale local queue warnings.
  if(ss.mode!=='secure_cloud'){sl.textContent='محلي';sl.className='sync';}
  else if(!online){sl.textContent='غير متصل';sl.className='sync err';}
  else if(sm.syncing&&!sm.verified&&!ss.session){sl.textContent='جاري الاتصال…';sl.className='sync pending';}
  else if(sm.verified||ss.session){sl.textContent='متصل ✓';sl.className='sync private-cloud';}

  ['Dashboard','Products','Devices','Invoices','Expenses','Reports','Shifts','Audit','Users','Settings'].forEach(x=>document.getElementById('v'+x).classList.add('hidden'));
  document.getElementById('v'+tab).classList.remove('hidden');
  rDash();rProducts();rDevices();rInvoices();rExpenses();rReports();rShifts();rAudit();rUsers();rSettings();
}

// SESSION HELPERS
// ============================================================
function sess(did){return state.sessions.find(s=>s.deviceId===did&&s.status==='open')}
function cost(s){
  let elapsed=Math.max(0,(Date.now()-new Date(s.start))/60000); // float minutes elapsed
  let d=state.devices.find(x=>x.id===s.deviceId)||{};
  let play=0,m=Math.ceil(elapsed)||1;
  if(s.sessionType==='match'){
    // Fixed price match
    play=+s.matchPrice||0;
  } else {
    // Open session: billed by hour rate
    let rate=s.mode==='multi'?d.multiRate:d.singleRate;
    play=elapsed/60*(+rate||0);
  }
  let dr=(s.items||[]).reduce((a,i)=>a+i.price*i.qty,0);
  return{m,elapsed,play,dr,total:play+dr}
}

function badge(d){
  let c=d.status==='available'?'b-ok':d.status==='busy'?'b-busy':'b-bad';
  let t=d.status==='available'?'✔ متاح':d.status==='busy'?'● مشغول':'✕ صيانة';
  return `<span class="badge ${c}">${t}</span>`
}

function isInstalledApp(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}
function installState(){
  if(isInstalledApp()) return {cls:'status-good',label:'التطبيق مثبت ويعمل كوضع مستقل ✓'};
  if(installPromptEvent) return {cls:'status-good',label:'جاهز للتثبيت كتطبيق على الهاتف ✓'};
  return {cls:'status-warn',label:'غير مثبت بعد — بعد تحديث النسخة اضغط فحص التثبيت.'};
}
async function installPwa(){
  if(isInstalledApp()){showNotice('التطبيق مثبت بالفعل على الهاتف ✓','success');return;}
  if(!installPromptEvent){
    showNotice('لم يظهر خيار التثبيت بعد. اضغط تحديث إجباري آمن ثم افتح الصفحة من Chrome وحاول مجددًا.', 'warn');
    return;
  }
  installPromptEvent.prompt();
  const choice = await installPromptEvent.userChoice;
  installPromptEvent = null;
  if(choice.outcome === 'accepted') showNotice('تم قبول تثبيت التطبيق ✓', 'success');
  else showNotice('تم إلغاء التثبيت. يمكنك المحاولة لاحقًا.', 'warn');
  render();
}
window.addEventListener('beforeinstallprompt', event=>{
  event.preventDefault();
  installPromptEvent = event;
  if(user && tab==='Settings') render();
});
window.addEventListener('appinstalled', ()=>{
  installPromptEvent = null;
  if(user){showNotice('تم تثبيت PS Cafe Manager بنجاح ✓','success');render();}
});

// ALERT / NOTIFICATION SYSTEM
// ============================================================
const alertedSessions={};// track which alerts have fired: {sid: {w10,w5,end,over}}

function notificationState(){
  if(!window.isSecureContext)return {code:'insecure',label:'يتطلب HTTPS',cls:'status-bad'};
  if(!('Notification' in window))return {code:'unsupported',label:'غير مدعوم على هذا المتصفح',cls:'status-bad'};
  if(Notification.permission==='granted')return {code:'granted',label:'مفعلة ✓',cls:'status-good'};
  if(Notification.permission==='denied')return {code:'denied',label:'محظورة من المتصفح',cls:'status-bad'};
  return {code:'default',label:'لم يتم السماح بعد',cls:'status-warn'};
}
async function enableNotifications(){
  const current=notificationState();
  if(current.code==='insecure'){showNotice('الإشعارات تحتاج فتح التطبيق من رابط HTTPS.', 'danger');return;}
  if(current.code==='unsupported'){showNotice('الإشعارات غير مدعومة على هذا المتصفح.', 'danger');return;}
  if(current.code==='granted'){showNotice('الإشعارات مفعلة بالفعل ✓', 'success');render();return;}
  if(current.code==='denied'){
    showNotice('الإشعارات محظورة. افتح إعدادات الموقع في Chrome ثم اسمح بالإشعارات.', 'danger');render();return;
  }
  try{
    const result=await Notification.requestPermission();
    render();
    if(result==='granted') showNotice('تم تفعيل الإشعارات بنجاح ✓', 'success');
    else if(result==='denied') showNotice('تم حظر الإشعارات. يمكنك السماح بها من إعدادات الموقع.', 'danger');
    else showNotice('لم يتم منح الإذن. فعّله من إعدادات الموقع عند الحاجة.', 'warn');
  }catch(err){
    render();showNotice('تعذر طلب إذن الإشعارات على هذا المتصفح.', 'danger');
  }
}

function fireAlert(sid,level,deviceName,minsLeft){
  if(!alertedSessions[sid])alertedSessions[sid]={};
  if(alertedSessions[sid][level])return; // already fired
  alertedSessions[sid][level]=true;

  let msg='',icon='⚠️',cls='t-warn';
  if(level==='w10'){msg=`${deviceName}: باقي 10 دقائق`;icon='⏰';cls='t-warn'}
  else if(level==='w5'){msg=`${deviceName}: باقي 5 دقائق فقط!`;icon='🔴';cls='t-danger'}
  else if(level==='end'){msg=`${deviceName}: الوقت انتهى!`;icon='🏁';cls='t-end'}
  else if(level==='over'){msg=`${deviceName}: تجاوز الوقت بـ 5 دقائق!`;icon='🚨';cls='t-danger'}

  // Sound (Web Audio API)
  playBeep(level);
  // Vibration
  if(navigator.vibrate){
    if(level==='w10') navigator.vibrate([200,100,200]);
    else if(level==='w5') navigator.vibrate([300,100,300,100,300]);
    else if(level==='end'||level==='over') navigator.vibrate([500,150,500,150,500,150,500]);
  }
  // Browser Notification
  if('Notification' in window && Notification.permission==='granted'){
    new Notification('PS Cafe Manager — '+deviceName,{body:msg.replace(deviceName+': ',''),icon:'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>'});
  }
  // Toast
  showToast(icon,msg,cls);
}

function playBeep(level){
  try{
    let ctx=new(window.AudioContext||window.webkitAudioContext)();
    let freqs={w10:[520,520],w5:[660,520,660],end:[800,600,400],over:[400,300,200,300,400]};
    let seq=freqs[level]||[520];
    let t=ctx.currentTime;
    seq.forEach((f,i)=>{
      let o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.frequency.value=f;o.type='sine';
      g.gain.setValueAtTime(0.3,t+i*0.18);
      g.gain.exponentialRampToValueAtTime(0.001,t+i*0.18+0.15);
      o.start(t+i*0.18);o.stop(t+i*0.18+0.15);
    });
    setTimeout(()=>ctx.close(),2000);
  }catch(e){}
}

function showToast(icon,msg,cls){
  let wrap=document.getElementById('alert-toast');
  let el=document.createElement('div');
  el.className='toast-item '+cls;
  el.innerHTML=`<span class="toast-icon">${icon}</span><span>${esc(msg)}</span>`;
  wrap.appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity 0.4s';setTimeout(()=>el.remove(),400)},5200);
}
function showNotice(msg,type='info'){
  const map={success:['✅','t-ok'],danger:['⚠️','t-danger'],warn:['⏰','t-warn'],info:['ℹ️','t-info']};
  const pair=map[type]||map.info;showToast(pair[0],msg,pair[1]);
}

function checkAlerts(){
  state.sessions.filter(s=>s.status==='open').forEach(s=>{
    if(s.sessionType!=='match')return; // only for timed matches
    let d=state.devices.find(x=>x.id===s.deviceId);
    if(!d)return;
    let elapsed=(Date.now()-new Date(s.start))/60000;
    let total=s.matchMins||0;
    let remaining=total-elapsed;
    let dname=d.name;

    if(remaining<=10 && remaining>5) fireAlert(s.id,'w10',dname,Math.ceil(remaining));
    if(remaining<=5 && remaining>0) fireAlert(s.id,'w5',dname,Math.ceil(remaining));
    if(remaining<=0 && elapsed<=total+1) fireAlert(s.id,'end',dname,0);
    if(elapsed>=total+5) fireAlert(s.id,'over',dname,Math.floor(elapsed-total));
  });
}

function getDeviceAlertClass(s){
  if(!s||s.sessionType!=='match')return '';
  let elapsed=(Date.now()-new Date(s.start))/60000;
  let total=s.matchMins||0;
  let remaining=total-elapsed;
  if(elapsed>=total)return 'overtime';
  if(remaining<=5)return 'warn-5';
  if(remaining<=10)return 'warn-10';
  return '';
}

function getTimerClass(s){
  if(!s||s.sessionType!=='match')return '';
  let elapsed=(Date.now()-new Date(s.start))/60000;
  let total=s.matchMins||0;
  let remaining=total-elapsed;
  if(elapsed>=total)return 'overtime-txt';
  if(remaining<=5)return 'warn-5-txt';
  if(remaining<=10)return 'warn-10-txt';
  return '';
}

function matchProgressBar(s){
  if(!s||s.sessionType!=='match')return '';
  let elapsed=(Date.now()-new Date(s.start))/60000;
  let total=s.matchMins||1;
  let pct=Math.min(100,elapsed/total*100);
  let barCls=pct<75?'ok-bar':pct<91?'warn10-bar':pct<101?'warn5-bar':'over-bar';
  return `<div class="match-progress-wrap"><div class="match-progress-bar ${barCls}" style="width:${Math.min(100,pct)}%"></div></div>
    <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted)">
      <span>${Math.floor(elapsed)} / ${total} د</span>
      <span>${elapsed>total?'تجاوز الوقت':'باقي '+Math.max(0,Math.ceil(total-elapsed))+' د'}</span>
    </div>`;
}

    </div>`);

function toggleMatchMode(m){
  document.getElementById('msm').value=m;
  document.getElementById('mm_single').className=m==='single'?'sel':'';
  document.getElementById('mm_multi').className=m==='multi'?'sel':'';
  updateMatchPrices();
}
function updateMatchPrices(){
  let did=val('msd');
  let d=state.devices.find(x=>x.id===did);
  if(!d)return;
  let mode=document.getElementById('msm')?.value||'single';
  let prices=d.matchPrices||DEF_MATCH_PRICES;
  let html=`<div class="match-price-table">`;
  prices.forEach((p,i)=>{
    let price=mode==='multi'?p.multi:p.single;
    html+=`<div class="match-price-row ${i===0?'sel':''}" id="mpr_${i}" onclick="selectMatchPrice(${i},${p.mins},${price})">
      <input type="radio" name="matchopt" ${i===0?'checked':''} id="mr_${i}">
      <span class="match-price-label">${p.mins} دقيقة</span>
      <span class="match-price-mins">${p.mins/15} ربع</span>
      <span class="match-price-val">${money(price)} ج</span>
    </div>`;
  });
  html+='</div>';
  document.getElementById('match-prices-list').innerHTML=html;
  // auto select first
  if(prices.length){
    let p=prices[0];
    let price=mode==='multi'?p.multi:p.single;
    document.getElementById('sel-match-mins').value=p.mins;
    document.getElementById('sel-match-price').value=price;
  }
}
function selectMatchPrice(idx,mins,price){
  document.querySelectorAll('.match-price-row').forEach((el,i)=>{el.className='match-price-row'+(i===idx?' sel':'')});
  document.getElementById('sel-match-mins').value=mins;
  document.getElementById('sel-match-price').value=price;
}
function startMatch(){
  let did=val('msd');if(!did)return alert('اختار جهاز');
  let mins=+val('sel-match-mins');
  let price=+val('sel-match-price');
  if(!mins||!price)return alert('اختار مدة المباراة');
  let sid=id();
  const d=state.devices.find(x=>x.id==did);
  state.sessions.push({id:sid,deviceId:did,customer:val('msc'),mode:document.getElementById('msm').value,sessionType:'match',matchMins:mins,matchPrice:price,items:[],start:new Date().toISOString(),status:'open',user:user.username,startedBy:user.username,startedById:user.id||'',startedAuthId:user.cloud?user.id:''});
  d.status='busy';
  audit('MATCH_START','session',sid,'بدء مباراة على '+d.name,{deviceId:did,deviceName:d.name,minutes:mins,price:price});
  closeM();save();
}

function actorLabel(){return user?.username||'User'}
function shiftLabelFromRecord(x){return x.closedByLabel||x.closed_by_label||x.cashierLabel||x.actor||''}
function shiftClosedAt(x){return x.closedAt||x.closed_at||x.date||x.created_at||''}
function shiftStartFor(label){
  const rows=(state.shiftClosures||[]).filter(x=>shiftLabelFromRecord(x)===label).sort((a,b)=>new Date(shiftClosedAt(b))-new Date(shiftClosedAt(a)));
  if(rows[0])return shiftClosedAt(rows[0]);
  const d=new Date();d.setHours(0,0,0,0);return d.toISOString();
}
function invActorLabel(i){return invActor(i)}
function invoiceNoNum(i){return Number(i.no)>0?Number(i.no):0}
function shiftSummary(label=actorLabel(),fromIso=null,toIso=null){
  const from=fromIso||shiftStartFor(label), to=toIso||new Date().toISOString();
  const list=(state.invoices||[]).filter(i=>{
    const t=new Date(i.date).getTime();
    return t>new Date(from).getTime() && t<=new Date(to).getTime() && invActorLabel(i)===label;
  }).sort((a,b)=>new Date(a.date)-new Date(b.date));
  return {
    label,from,to,invoices:list,
    invoiceCount:list.length,
    firstInvoiceNo:list.length?invoiceNoNum(list[0]):0,
    lastInvoiceNo:list.length?invoiceNoNum(list[list.length-1]):0,
    playTotal:list.reduce((a,i)=>a+(+i.playTotal||0),0),
    drinkTotal:list.reduce((a,i)=>a+(+i.drinkTotal||0),0),
    total:list.reduce((a,i)=>a+(+i.total||0),0)
  };
}

function friendlySyncError(status,raw){
  const txt=String(raw||'');
  if(status===400&&/invalid|login|credentials/i.test(txt))return 'بيانات دخول السحابة غير صحيحة.';
  if(status===401)return 'انتهت جلسة السحابة أو بيانات الدخول غير صحيحة.';
  if(status===403)return 'الحساب لا يملك صلاحية الوصول إلى بيانات النشاط.';
  if(status===404)return 'جداول قاعدة البيانات غير جاهزة. نفّذ ملف 01_SCHEMA_PRODUCTION.sql أولاً.';
  if(/row-level security|rls/i.test(txt))return 'رفضت قاعدة البيانات العملية بسبب الصلاحيات المحددة.';
  if(/Failed to fetch|NetworkError/i.test(txt))return 'تعذر الوصول إلى قاعدة البيانات. افحص الإنترنت أو الرابط.';
  return 'تعذر إتمام العملية ('+status+').';
}

async function authFetch(path,opts={}){
  const s=st();if(!navigator.onLine)throw Error('لا يوجد اتصال بالإنترنت.');
  if(!s.url||!s.key)throw Error('إعدادات قاعدة البيانات غير موجودة على هذا الجهاز.');
  let response;try{response=await fetch(s.url+path,{...opts,headers:{apikey:s.key,'Content-Type':'application/json',...(opts.headers||{})}})}catch(e){throw Error('تعذر الوصول إلى قاعدة البيانات. افحص الإنترنت أو الرابط.')}
  const raw=await response.text();if(!response.ok)throw Error(friendlySyncError(response.status,raw));
  try{return raw?JSON.parse(raw):{}}catch(e){return {}}
}
async function cloudSignInCredentials(email,password){
  let s=st();setSyncMeta({syncing:true,lastError:''});
  const data=await authFetch('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})});
  if(!data.access_token||!data.user)throw Error('لم يتم إنشاء جلسة دخول آمنة.');
  s.session={access_token:data.access_token,refresh_token:data.refresh_token,expires_at:Math.floor(Date.now()/1000)+(data.expires_in||3600),userId:data.user.id,email:data.user.email};s.cloudEmail=email;s.mode='secure_cloud';s.schema='normalized_v1';setst(s);return data.user;
}
async function cloudSignIn(password){ return cloudSignInCredentials(st().cloudEmail,password); }
async function cloudSignOut(showMessage=true){

  if(showMessage)showNotice('تم تسجيل الخروج من قاعدة بيانات النشاط.', 'success');
}
async function ensureCloudToken(){
  let s=st();if(s.mode!=='secure_cloud')throw Error('قاعدة بيانات المالك غير مفعلة.');
  if(!s.session||!s.session.access_token)throw Error('يلزم تسجيل دخول المستخدم إلى قاعدة البيانات.');
  if((s.session.expires_at||0)>Math.floor(Date.now()/1000)+60)return s.session.access_token;
  const data=await authFetch('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:s.session.refresh_token})});
  s.session={...s.session,access_token:data.access_token,refresh_token:data.refresh_token||s.session.refresh_token,expires_at:Math.floor(Date.now()/1000)+(data.expires_in||3600)};setst(s);return s.session.access_token;
}
async function req(method,path,body,prefer='return=representation'){
  const s=st();if(!navigator.onLine)throw Error('لا يوجد اتصال بالإنترنت. البيانات محفوظة على الجهاز.');
  if(!s.url||!s.key||!s.businessId)throw Error('إعدادات قاعدة بيانات النشاط غير مكتملة.');
  const token=await ensureCloudToken();let r;
  try{r=await fetch(s.url+'/rest/v1/'+path,{method,headers:{apikey:s.key,Authorization:'Bearer '+token,'Content-Type':'application/json',Prefer:prefer},body:body?JSON.stringify(body):undefined})}
  catch(err){throw Error('تعذر الوصول إلى قاعدة البيانات. افحص الإنترنت أو الرابط.');}
  const raw=await r.text();if(!r.ok)throw Error(friendlySyncError(r.status,raw));
  try{return raw?JSON.parse(raw):[]}catch(e){return []}
}

  return rows&&rows[0];
}

  const pending=(state.auditLogs||[]).filter(l=>!l.cloudSynced);if(!pending.length)return;

}
async function saveCloud(){
  const b=st().businessId, uid=actorAuthId();if(!uid)throw Error('لا توجد جلسة مستخدم سحابية صالحة.');
  if(owner())await req('POST','ps_business_profiles?on_conflict=business_id',[{business_id:b,owner_name:state.profile.ownerName||'',phone:state.profile.phone||'',address:state.profile.address||'',updated_by:uid}],'resolution=merge-duplicates,return=minimal');
  if(owner()||manager())await req('POST','ps_devices?on_conflict=business_id,id',(state.devices||[]).map(d=>({business_id:b,id:d.id,name:d.name,single_rate:+d.singleRate||0,multi_rate:+d.multiRate||0,maintenance:d.status==='maintenance',match_prices:d.matchPrices||[],updated_by:uid})),'resolution=merge-duplicates,return=minimal');
  await req('POST','ps_products?on_conflict=business_id,id',(state.products||[]).map(p=>({business_id:b,id:p.id,name:p.name,price:+p.price||0,stock:+p.stock||0,active:!!p.active,updated_by:uid})),'resolution=merge-duplicates,return=minimal');
  // Upload sessions as open first so drinks can be attached safely; then close completed sessions.
  const openBase=(state.sessions||[]).map(s=>sessionCloudRow(s,true));
  if(openBase.length)await req('POST','ps_sessions?on_conflict=business_id,id',openBase,'resolution=ignore-duplicates,return=minimal');
  const openUpdates=(state.sessions||[]).filter(s=>s.status==='open').map(s=>sessionCloudRow(s,false));
  if(openUpdates.length)await req('POST','ps_sessions?on_conflict=business_id,id',openUpdates,'resolution=merge-duplicates,return=minimal');
  const currentSessionItems=await req('GET',`ps_session_items?business_id=eq.${encodeURIComponent(b)}&select=id`);
  const existingSessionItemIds=new Set((currentSessionItems||[]).map(x=>x.id));
  const si=sessionItemRows().filter(x=>!existingSessionItemIds.has(x.id));
  if(si.length)await req('POST','ps_session_items?on_conflict=business_id,id',si,'resolution=ignore-duplicates,return=minimal');
  for(const s of (state.sessions||[]).filter(x=>x.status==='closed')){
    await req('PATCH',`ps_sessions?business_id=eq.${encodeURIComponent(b)}&id=eq.${encodeURIComponent(s.id)}&status=eq.open`,sessionCloudRow(s,false),'return=minimal');
  }
  // Invoices are insert-only; avoid repeat inserts so the database counter never skips numbers on re-sync.
  const existingInvoices=await req('GET',`ps_invoices?business_id=eq.${encodeURIComponent(b)}&select=id,invoice_no`);
  const invoiceNumbers=new Map((existingInvoices||[]).map(x=>[x.id,Number(x.invoice_no)]));
  for(const inv of (state.invoices||[])){
    if(invoiceNumbers.has(inv.id)){inv.no=invoiceNumbers.get(inv.id);continue;}
    const inserted=await req('POST','ps_invoices',[invoiceCloudRow(inv)],'return=representation');
    if(inserted&&inserted[0]&&Number(inserted[0].invoice_no)>0){inv.no=Number(inserted[0].invoice_no);}
  }
  const ii=invoiceItemRows();if(ii.length)await req('POST','ps_invoice_items?on_conflict=business_id,id',ii,'resolution=ignore-duplicates,return=minimal');
  if(owner()||manager()){
    const ex=(state.expenses||[]).map(e=>({business_id:b,id:e.id,expense_date:e.date,expense_type:e.type,amount:+e.amount||0,note:e.note||'',created_at:e.createdAt||new Date().toISOString(),created_by:uid,creator_label:e.createdBy||user.username}));
    if(ex.length)await req('POST','ps_expenses?on_conflict=business_id,id',ex,'resolution=ignore-duplicates,return=minimal');
  }
  const sc=(state.shiftClosures||[]).filter(x=>!x.cloudSynced).map(x=>({business_id:b,id:x.id,opened_at:x.openedAt,closed_at:x.closedAt,closed_by:x.closedBy||uid,closed_by_label:x.closedByLabel||user.username,invoice_count:+x.invoiceCount||0,first_invoice_no:+x.firstInvoiceNo||null,last_invoice_no:+x.lastInvoiceNo||null,play_total:+x.playTotal||0,drink_total:+x.drinkTotal||0,total:+x.total||0,actual_cash:+x.actualCash||0,difference:+x.difference||0,notes:x.notes||'',created_at:x.createdAt||x.closedAt||new Date().toISOString()}));
  if(sc.length){await req('POST','ps_shift_closures?on_conflict=business_id,id',sc,'resolution=ignore-duplicates,return=minimal');const ids=new Set(sc.map(x=>x.id));state.shiftClosures=(state.shiftClosures||[]).map(x=>ids.has(x.id)?{...x,cloudSynced:true}:x);}
  await pushCloudAuditLogs();
  localStorage.setItem(K,JSON.stringify(state));dirty=false;setQueue([]);setSyncMeta({verified:true,syncing:false,lastSuccess:new Date().toISOString(),lastError:''});render();return true;
}
async function loadCloud(force=false){
  if(dirty&&!force||queue().length&&!force)return false;
  const b=st().businessId;
  const [profiles,devices,products,sessions,sitems,invoices,iitems,expenses,shiftClosures,logs,members]=await Promise.all([
    req('GET',`ps_business_profiles?business_id=eq.${encodeURIComponent(b)}&select=*`),
    req('GET',`ps_devices?business_id=eq.${encodeURIComponent(b)}&select=*`),
    req('GET',`ps_products?business_id=eq.${encodeURIComponent(b)}&select=*`),
    req('GET',`ps_sessions?business_id=eq.${encodeURIComponent(b)}&select=*`),
    req('GET',`ps_session_items?business_id=eq.${encodeURIComponent(b)}&select=*`),
    req('GET',`ps_invoices?business_id=eq.${encodeURIComponent(b)}&select=*&order=created_at.desc`),
    req('GET',`ps_invoice_items?business_id=eq.${encodeURIComponent(b)}&select=*`),
    (owner()||manager())?req('GET',`ps_expenses?business_id=eq.${encodeURIComponent(b)}&select=*`):Promise.resolve([]),
    req('GET',`ps_shift_closures?business_id=eq.${encodeURIComponent(b)}&select=*&order=closed_at.desc`),
    owner()?req('GET',`ps_audit_logs?business_id=eq.${encodeURIComponent(b)}&select=*&order=occurred_at.desc&limit=300`):Promise.resolve([]),
    owner()?req('GET',`ps_members?business_id=eq.${encodeURIComponent(b)}&select=*`):Promise.resolve([])
  ]);
  cloudMembers=members||[];
  const itemMap={};(sitems||[]).forEach(i=>(itemMap[i.session_id]||(itemMap[i.session_id]=[])).push({id:i.id,productId:i.product_id,name:i.name,price:+i.price,qty:+i.qty,addedAt:i.added_at}));
  const invItemMap={};(iitems||[]).forEach(i=>(invItemMap[i.invoice_id]||(invItemMap[i.invoice_id]=[])).push({id:i.id,productId:i.product_id,name:i.name,price:+i.price,qty:+i.qty}));
  const mappedSessions=(sessions||[]).map(s=>({id:s.id,deviceId:s.device_id,customer:s.customer,mode:s.play_mode,sessionType:s.session_type,matchMins:s.match_minutes,matchPrice:+s.match_price||null,items:itemMap[s.id]||[],start:s.started_at,status:s.status,end:s.ended_at,startedBy:s.started_by_label||'غير محدد',startedById:s.started_by,endedBy:s.ended_by_label||'',endedById:s.ended_by}));
  const openIds=new Set(mappedSessions.filter(s=>s.status==='open').map(s=>s.deviceId));
  const localUsers=state.users||[];
  state={users:localUsers,profile:{businessName:state.profile?.businessName||'PS Cafe',ownerName:profiles[0]?.owner_name||'',phone:profiles[0]?.phone||'',address:profiles[0]?.address||''},devices:(devices||[]).map(d=>({id:d.id,name:d.name,status:d.maintenance?'maintenance':(openIds.has(d.id)?'busy':'available'),singleRate:+d.single_rate,multiRate:+d.multi_rate,matchPrices:d.match_prices||[]})),products:(products||[]).map(p=>({id:p.id,name:p.name,price:+p.price,stock:+p.stock,active:p.active})),sessions:mappedSessions,invoices:(invoices||[]).map(i=>({id:i.id,no:+i.invoice_no,date:i.created_at,deviceId:i.device_id,deviceName:i.device_name,customer:i.customer,mode:i.play_mode,sessionType:i.session_type,matchMins:i.match_minutes,start:i.started_at,end:i.ended_at,minutes:i.minutes,playTotal:+i.play_total,drinkTotal:+i.drink_total,total:+i.total,items:invItemMap[i.id]||[],payment:i.payment_method,issuedBy:i.creator_label})),expenses:(expenses||[]).filter(e=>!e.voided_at).map(e=>({id:e.id,date:e.expense_date,type:e.type||e.expense_type,amount:+e.amount,note:e.note,createdBy:e.creator_label,createdAt:e.created_at})),shiftClosures:(shiftClosures||[]).map(x=>({id:x.id,openedAt:x.opened_at,closedAt:x.closed_at,closedBy:x.closed_by,closedByLabel:x.closed_by_label,invoiceCount:+x.invoice_count||0,firstInvoiceNo:+x.first_invoice_no||0,lastInvoiceNo:+x.last_invoice_no||0,playTotal:+x.play_total||0,drinkTotal:+x.drink_total||0,total:+x.total||0,actualCash:+x.actual_cash||0,difference:+x.difference||0,notes:x.notes||'',createdAt:x.created_at,cloudSynced:true})),auditLogs:(logs||[]).map(l=>({id:l.id,at:l.occurred_at,action:l.action,entityType:l.entity_type,entityId:l.entity_id,summary:l.summary,details:l.details,actor:l.actor_label,actorRole:l.actor_role,cloudSynced:true})),nextInvoice:Math.max(1,...(invoices||[]).map(i=>+i.invoice_no+1)),updatedAt:new Date().toISOString()};
  localStorage.setItem(K,JSON.stringify(state));setSyncMeta({verified:true,syncing:false,lastError:'',lastSuccess:new Date().toISOString()});dirty=false;setQueue([]);render();return true;
}
async function connectOwnerCloud(){
  if(!owner())return;const cfg=currentCloudInputs();
  if(cfg.mode==='offline'){setst({...cfg,session:null});setSyncMeta({verified:false,lastError:'',syncing:false,lastSuccess:''});showNotice('تم ضبط البيانات على الجهاز فقط.', 'success');return;}

  localStorage.setItem(SK,JSON.stringify({...cfg,schema:'normalized_v1'}));
  try{await cloudSignInCredentials(cfg.cloudEmail,password);await testSupabaseConnection();await saveCloud();showNotice('تم ربط قاعدة المالك ونقل بيانات هذا الجهاز إلى الجداول الآمنة ✓', 'success');}

async function flushQueue(){
  if(st().mode!=='secure_cloud')return false;if(!navigator.onLine)throw Error('الإنترنت غير متصل. تم حفظ العملية على الجهاز وستتم المزامنة لاحقًا.');
  setSyncMeta({syncing:true,lastError:''});await saveCloud();return true;
}
async function manualSync(){
  if(st().mode!=='secure_cloud'){showNotice('قاعدة بيانات صاحب النشاط غير مربوطة بعد.', 'warn');return;}
  try{await flushQueue();await loadCloud();showNotice('تمت مزامنة بيانات النشاط بأمان ✓', 'success');}catch(e){setSyncMeta({verified:false,syncing:false,lastError:e.message});render();showNotice('لم تتم المزامنة: '+e.message, 'danger');}
}
function sched(){if(st().mode==='secure_cloud'){clearTimeout(window.sd);window.sd=setTimeout(()=>flushQueue().catch(e=>{setSyncMeta({verified:false,syncing:false,lastError:e.message});render()}),1200)}}
function setup(){if(st().mode==='secure_cloud'){setQueue([]);dirty=false;}clearInterval(timer);window.removeEventListener('online',window.__psOnline||(()=>{}));window.__psOnline=()=>{if(st().mode==='secure_cloud'&&st().session)flushQueue().catch(e=>setSyncMeta({verified:false,syncing:false,lastError:e.message}))};window.addEventListener('online',window.__psOnline);if(st().mode==='secure_cloud'&&st().session)timer=setInterval(()=>{if(dirty||queue().length)flushQueue().catch(e=>{setSyncMeta({verified:false,syncing:false,lastError:e.message});render()});else loadCloud().catch(e=>setSyncMeta({verified:false,syncing:false,lastError:e.message}))},15000)}

async function checkForUpdate(){
  try{
    if(!('serviceWorker' in navigator)){showNotice('التحديث التلقائي غير مدعوم هنا.', 'warn');return;}
    const reg=swRegistration||await navigator.serviceWorker.getRegistration();
    if(!reg){showNotice('Service Worker غير مسجل بعد. أعد فتح التطبيق.', 'warn');return;}
    await reg.update();showNotice('تم فحص التحديث. لو توجد نسخة جديدة سيتم تحميلها عند إعادة الفتح.', 'success');
  }catch(e){showNotice('تعذر فحص التحديث الآن.', 'danger')}
}
async function clearAppCacheAndReload(){
  if(!confirm('تحديث ملفات التطبيق الآن؟ لن يتم حذف البيانات أو الفواتير المحفوظة.'))return;
  try{
    const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('ps-cafe-')).map(k=>caches.delete(k)));
    if(swRegistration)await swRegistration.update();
    location.reload(true);
  }catch(e){showNotice('تعذر تحديث الكاش الآن.', 'danger')}
}
